# ================================================================
# deploy-ig-dm-hub.yml — Instagram DM hub edge function deploy (D47)
# Meta webhook anonymous call karta hai ⇒ --no-verify-jwt (function ke
# andar verify_token + DB server-only tables hi asli gate hain).
# Manual: Actions -> "Deploy ig-dm-hub function" -> Run workflow.
# ================================================================
name: Deploy ig-dm-hub function

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/functions/ig-dm-hub/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: hddhkculuyrfoevxmlwy
    steps:
      - uses: actions/checkout@v4

      - name: Check Supabase deployment credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret missing hai."
            exit 1
          fi
          echo "Supabase deployment credentials available."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ig-dm-hub
        shell: bash
        run: supabase functions deploy ig-dm-hub --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Smoke test (webhook verify handshake)
        shell: bash
        run: |
          sleep 3
          RESP=$(curl -s "https://hddhkculuyrfoevxmlwy.functions.supabase.co/ig-dm-hub?hub.mode=subscribe&hub.verify_token=igdmc_verify_20261107&hub.challenge=4242")
          echo "verify response: $RESP"
          if [ "$RESP" != "4242" ]; then echo "::error::handshake fail"; exit 1; fi
          echo "handshake OK"
