name: Supabase secrets ops

# ═══════════════════════════════════════════════════════════════
#  Supabase project secrets par audited ops (directive 16):
#    list               → names+digests (values kabhi print nahi)
#    bridge-push-secret → DB push_hook_config.hook_secret →
#                         Supabase secret PUSH_TRIGGER_SECRET
#                         (zero-downtime bridge; push-send v4 isi
#                         ko padhta hai, legacy ONESIGNAL_TRIGGER_
#                         SECRET env retire hone se pehle)
#    delete-onesignal   → ONESIGNAL_* secrets delete
#  Values na log hoti hain na artifact me — sirf names/status.
# ═══════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'list | bridge-push-secret | delete-onesignal'
        required: true
        default: 'list'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Secrets op (Management API)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node tools/supabase-secrets.mjs "${{ github.event.inputs.action }}"
