name: Build Mini eSports APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          # AGP 8.2.2 ke saath Gradle 8.2 use karo — exact match, safe hai

      - name: Generate Keystore
        run: |
          keytool -genkeypair \
            -keystore android/app/keystore.jks \
            -storetype PKCS12 \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=MiniEsports, OU=App, O=MiniEsports, L=India, ST=India, C=IN" \
            -noprompt
          echo "✅ Keystore generated:"
          ls -lh android/app/keystore.jks

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace
        # --stacktrace add kiya — agar dobara fail ho to exact error line dikhega

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniEsports-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Save Keystore Artifact (Play Store ke liye)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: android/app/keystore.jks
          retention-days: 90

      - name: Build Release AAB (Play Store)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MiniEsports-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
