name: Build Mini eSports APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # ══════════════════════════════════════════════════════════
          # AUTO-VERSION (R3 Phase-16): पूरी git history चाहिए — build.gradle
          # versionCode/versionName = git commit count से बनाता है। depth:1
          # (shallow) पर count=1 मिलता और Play-Store reject होता। यह
          # fetch-depth: 0 पूरा history लाता है।
          # ══════════════════════════════════════════════════════════
          fetch-depth: 0

      # ══════════════════════════════════════════════════════════
      # 🔢 VERSION SYNC GATE (2026-10-06)
      # ──────────────────────────────────────────────────────────
      # Har release par ye numbers badalne padte hain — ek bhi chhoota
      # to fix users tak pahunchta hi nahi (purani cache serve hoti
      # rehti hai; sw.js ke comments me yeh dard likha hua hai):
      #   index.html ke ~101 ?v=  |  sw.js ASSET_VER  |  sw.js CACHE_VER
      #   manifest.json  |  js/screens/features ke andar ke ?v=
      # scripts/version-sync.mjs yeh sab EK command me karti hai
      # (pre-commit hook bhi laga hua hai: bash scripts/install-hooks.sh).
      # Agar koi number pichhe chhoot gaya ho to BUILD YAHI ruk jayegi —
      # adhoori/stale release kabhi publish nahi hogi.
      # ══════════════════════════════════════════════════════════
      - name: Version Sync Gate (cache-busting numbers)
        run: |
          node scripts/version-sync.mjs --check --require-if-changed

      - name: Show auto-computed version
        run: |
          CNT="$(git rev-list --count HEAD)"
          MAJ="$(sed -n 's/^def VERSION_MAJOR = \([0-9]*\).*/\1/p' android/app/build.gradle | head -1)"
          MIN="$(sed -n 's/^def VERSION_MINOR = \([0-9]*\).*/\1/p' android/app/build.gradle | head -1)"
          echo "commit count  = $CNT"
          echo "versionCode   = $CNT"
          echo "versionName   = ${MAJ:-?}.${MIN:-?}.$CNT"
          echo "(build.gradle defaultConfig इन्हीं से बनता है — कोई manual bump नहीं)"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      # ══════════════════════════════════════════════════════════
      # KEYSTORE STRATEGY
      # ──────────────────────────────────────────────────────────
      # PEHLI BAAR: Naya keystore generate hoga → SHA-1 logs mein
      #   dikhega → use Firebase Console mein register karo
      #   → keystore artifact download karo → base64 karo
      #   → KEYSTORE_B64 secret mein save karo
      #
      # BAAD MEIN: KEYSTORE_B64 secret se same keystore use hoga
      #   → same SHA-1 → Google login kaam karega
      # ══════════════════════════════════════════════════════════

      - name: Setup Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            # ── Saved keystore use karo (same SHA-1 every build) ──
            echo "✅ Saved keystore found — using it"
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android/app/keystore.jks
          else
            # ── First time: Naya keystore generate karo ──
            # 🔒 R29E P0-FIX (2026-09-22): build fail kar do, silently naya
            #    keystore GEN nahi — naye key se SHA-1 badal jata hai (Google
            #    login/firebase break) aur keyloc दो अलग-अलग app-identity
            #    ban jati hai. Pehle secret set karo, phir build.
            echo "❌ KEYSTORE_B64 secret set nahi hai — pehle secret sahi"
            echo "   se save karo (repo secrets), phir build chalao."
            echo "   Naya keystore yahan generate NAHI hota (R29E fix)."
            exit 1
          fi
          echo "Keystore ready:" && ls -lh android/app/keystore.jks

      # ── SHA-1 print karo — Firebase Console mein register karo ──
      - name: Print SHA-1 (Firebase Console → Android App → Add Fingerprint)
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  GOOGLE LOGIN FIX — Yeh SHA-1 copy karo"
          echo "  Firebase Console → fft-app-1e283 → Project Settings"
          echo "  → Your Apps → Android App → Add Fingerprint"
          echo "════════════════════════════════════════════════════════"
          keytool -list -v \
            -keystore android/app/keystore.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias    "${{ secrets.KEY_ALIAS }}" \
            | grep -E "SHA1:|SHA256:" | head -4
          echo "════════════════════════════════════════════════════════"
          echo ""

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniEsports-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish Latest APK to GitHub Releases (Direct Download URL)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CNT="$(git rev-list --count HEAD)"
          TAG="v1.0.${CNT}"
          cp android/app/build/outputs/apk/release/app-release.apk MiniEsports.apk
          gh release create "$TAG" MiniEsports.apk \
            --title "Mini eSports $TAG (Official APK)" \
            --notes "Auto-published signed release APK ($TAG) for Force Update & direct download." \
            --latest || \
          gh release upload "$TAG" MiniEsports.apk --clobber

      # ── 🔒 R29E P0-FIX (2026-09-22): Keystore artifact upload REMOVED — ye
      #    signing key ko publically downloadable artifact bana deta tha
      #    (koi bhi contributor APK sign + update-push kar sakta tha). Keystore
      #    ab SIRF KEYSTORE_B64 secret me rahega, artifact me kabhi nahi. ──

      - name: Build Release AAB (Play Store)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MiniEsports-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

  emulator-e2e:
    name: Live Android Emulator APK E2E Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download Built Release APK
        uses: actions/download-artifact@v4
        with:
          name: MiniEsports-APK
          path: apk-out

      - name: Prepare Emulator E2E Script
        run: |
          cat << 'EOF' > /tmp/e2e-emulator.sh
          #!/usr/bin/env bash
          set -e
          PKG="com.miniesports.app"
          echo "=== 1. Installing Release APK on Live Android Emulator ==="
          adb install -r apk-out/app-release.apk
          adb shell pm list packages | grep "$PKG"

          echo "=== 2. Verifying Installed Version & REQUEST_INSTALL_PACKAGES Permission ==="
          adb shell dumpsys package "$PKG" | grep -E "versionCode|versionName|REQUEST_INSTALL_PACKAGES"

          echo "=== 3. Launching Mini eSports MainActivity on Emulator ==="
          adb logcat -c
          adb shell am start -W -n "$PKG/.MainActivity"
          sleep 12

          echo "=== 4. Verify Process is Alive & Zero Fatal Crash ==="
          PID=$(adb shell pidof "$PKG" | tr -d '\r')
          echo "Running PID: $PID"
          if [ -z "$PID" ]; then
            echo "❌ App process not running!"
            adb logcat -d | tail -n 120
            exit 1
          fi
          if adb logcat -d | grep -E "FATAL EXCEPTION.*$PKG"; then
            echo "❌ Fatal exception detected in logcat!"
            exit 1
          fi

          echo "=== 4b. Declared Permissions Audit (camera NAHI hona chahiye) ==="
          adb shell dumpsys package "$PKG" | sed -n '/requested permissions:/,/install permissions:/p' || true
          if adb shell dumpsys package "$PKG" | sed -n '/requested permissions:/,/install permissions:/p' | grep -qi "CAMERA"; then
            echo "❌ CAMERA permission abhi bhi declared hai!"
            exit 1
          fi
          echo "✅ CAMERA declared nahi hai"

          echo "=== 5. Verify WebView Loaded & Capture Live Emulator Screenshot + UI Hierarchy ==="
          adb shell uiautomator dump /sdcard/window_dump.xml || true
          adb pull /sdcard/window_dump.xml emulator-ui-dump.xml || true
          adb exec-out screencap -p > emulator-live-screen.png
          ls -lh emulator-live-screen.png

          # ══════════════════════════════════════════════════════════
          # ✅ GEHRI JANCH (2026-10-07, live-testing round): pehle ye script
          # sirf "app crash nahi hui" tak seemit thi. Ab ye bhi pakadta hai ki
          # WebView me ASLI live app load hui ya error-page dikha.
          # ══════════════════════════════════════════════════════════
          echo "=== 6. WebView load-error audit (net::ERR / error page) ==="
          if [ -f emulator-ui-dump.xml ] && grep -qiE "net::ERR|Webpage not available|ERR_CONNECTION|ERR_NAME_NOT_RESOLVED|ERR_INTERNET_DISCONNECTED" emulator-ui-dump.xml; then
            echo "❌ WebView me load-error / error-page mila:"
            grep -oiE "net::ERR[A-Z_]*|Webpage not available|ERR_CONNECTION[A-Z_]*" emulator-ui-dump.xml | head -5
            exit 1
          fi
          echo "✅ WebView me koi net::ERR / error-page marker nahi"

          echo "=== 7. Focused activity + WebView provider ==="
          adb shell dumpsys activity activities | grep -m2 -E "topResumedActivity|mResumedActivity" || true
          adb shell dumpsys webviewupdate 2>/dev/null | head -6 || true

          echo "=== 8. Live host requests (logcat, soft) ==="
          adb logcat -d | grep -oE "https?://[a-zA-Z0-9./_?=&-]+" | sort -u | grep -E "deepsilence10161-source.github.io|supabase" | head -10 || echo "(release build me WebView URL log nahi karta — soft check)"

          echo "=== 9. Push/notification SDK + permissions (soft) ==="
          adb logcat -d | grep -iE "onesignal|subscription|fcm" | head -10 || echo "(push SDK log nahi mila — soft check)"
          adb shell dumpsys package "$PKG" | grep -iE "POST_NOTIFICATIONS|android.permission.INTERNET|ACCESS_FINE_LOCATION" | head -6 || true

          echo "=== 10. Screenshot me asli content (blank screen nahi) ==="
          SSIZE=$(stat -c%s emulator-live-screen.png 2>/dev/null || echo 0)
          echo "screenshot bytes: $SSIZE"
          if [ "$SSIZE" -lt 8000 ]; then
            echo "❌ Screenshot bahut chhoti — screen blank ya render fail ho sakta hai"
            exit 1
          fi
          echo "✅ Screenshot me asli content hai"
          echo "✅ LIVE ANDROID EMULATOR APK E2E VERIFIED (deep audit ke saath)!"
          EOF
          chmod +x /tmp/e2e-emulator.sh

      - name: Run APK on Android Emulator & Verify E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash /tmp/e2e-emulator.sh

  # ✅ (2026-10-06) Notification permission ka ASLI saboot.
  # POST_NOTIFICATIONS runtime permission sirf Android 13+ (API 33+) par hoti hai —
  # API 30 wale emulator par wo dialog aata hi nahi, isliye upar wali job me ye
  # dikh hi nahi sakta tha. Yahan API 34 par: pehle location pm grant se de dete
  # hain, phir app kholte hain — ab notification ka dialog aana CHAHIYE.
  notif-permission-e2e:
    needs: build
    runs-on: ubuntu-latest
    # ✅ FIX (2026-10-06): pehle is job par koi timeout nahi tha — emulator
    # atakne par pura workflow ghanton latak jata tha (aur proof banti hi nahi).
    # 12 minute me poora kaam (boot + install + dump + tap + verify) ho jata
    # hai; atakne par job fail hoti hai, chup-chaap latakti nahi.
    timeout-minutes: 15
    steps:
      # ✅ FIX (2026-10-06, run 37500271627 ka asli sabab): is job me KVM enable
      # karne wala step hi nahi tha (emulator-e2e me hai). Bina uske emulator
      # "You're running a Linux VM where hardware acceleration is not available
      # ... Disabling Linux hardware acceleration" ke saath SOFTWARE mode me
      # chalta hai aur boot hi poora nahi hota — log me `getprop
      # sys.boot_completed` khaali aata rehta hai (11+ minute), isliye dialog
      # tak baat kabhi pahunchti hi nahi. Ab wahi KVM step yahan bhi hai.
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download Built Release APK
        uses: actions/download-artifact@v4
        with:
          name: MiniEsports-APK
          path: apk-out

      - name: Prepare Notification Permission E2E Script
        run: |
          cat << 'EOF' > /tmp/e2e-notif.sh
          #!/usr/bin/env bash
          # ✅ FIX (2026-10-06): pehle run me `set -e` ki wajah se adb install ke
          # ek "Broken pipe" par script chup-chaap ruk gaya aur evidence bhi nahi bani.
          # Ab: boot ka pura intezaar → install 3 koshish (adb restart ke sath) →
          # aur har haal me screenshot (faisla screenshot se ho sake).
          PKG="com.miniesports.app"
          # ✅ FIX (2026-10-06): emulator kabhi-kabhi ("system isn't responding"
          # ke waqt) `adb shell dumpsys`/`uiautomator dump` par HAMESHA ke liye
          # atak jata hai — `|| true` isse nahi rokti. Ab har adb call par 25s
          # ka timeout hai, isliye script aage badhti rahegi aur evidence bhi
          # ban jayegi (isi wajah se run 37498031435/37498643802 ka notif step
          # hang hua tha).
          adbt() { timeout 25 adb "$@"; }
          echo "=== Android API level: $(adb shell getprop ro.build.version.sdk) ==="

          echo "=== Boot poora hone ka intezaar (package manager ready) ==="
          adbt wait-for-device
          for i in $(seq 1 60); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n')
            PMOK=$(adb shell pm path android 2>/dev/null | tr -d '\r\n')
            if [ "$BOOT" = "1" ] && [ -n "$PMOK" ]; then echo "   boot ok (koshish $i)"; break; fi
            echo "   booting... $i (boot=$BOOT pm=$PMOK)"
            sleep 5
          done

          echo "=== Install APK (3 koshish) ==="
          INSTALLED=""
          for i in 1 2 3; do
            if adbt install -r apk-out/app-release.apk; then INSTALLED="yes"; break; fi
            echo "   install koshish $i fail — adbt restart + 10s"
            adbt kill-server >/dev/null 2>&1; sleep 2; adbt start-server >/dev/null 2>&1; sleep 8
          done
          if [ -z "$INSTALLED" ]; then
            echo "❌ APK install 3 koshish me nahi hua"
            adbt exec-out screencap -p > notif-permission-screen.png 2>/dev/null || true
            echo "✅ NOTIFICATION PERMISSION E2E COMPLETE"   # evidence upload ho jaye
            exit 1
          fi
          adbt shell pm path "$PKG" | head -1

          echo "=== POST_NOTIFICATIONS declared hai? ==="
          adbt shell dumpsys package "$PKG" | grep -q "POST_NOTIFICATIONS" && echo "✅ declared" || { echo "❌ missing"; exit 1; }
          adbt shell dumpsys package "$PKG" | grep -qi "CAMERA" && { echo "❌ CAMERA declared hai!"; exit 1; } || echo "✅ CAMERA declared nahi hai"

          echo "=== POST_NOTIFICATIONS ko ZABARDASTI chheeno (takay app ko maangna HI pade) ==="
          adbt shell pm revoke "$PKG" android.permission.POST_NOTIFICATIONS || true
          adbt shell dumpsys package "$PKG" | grep -A2 "android.permission.POST_NOTIFICATIONS" | head -4

          echo "=== Location pehle se de do, taki notification ka dialog saaf dikhe ==="
          adbt shell pm grant "$PKG" android.permission.ACCESS_FINE_LOCATION || true
          adbt shell pm grant "$PKG" android.permission.ACCESS_COARSE_LOCATION || true

          echo "=== Launch app ==="
          # ✅ FIX (2026-10-06, run 37479470012): emulator par launch ke baad ANR
          #  dialog ("Mini eSports isn't responding") aa jata tha — wo permission
          #  dialog ke UPAR aa kar focus le leta hai, isliye uiautomator dump
          #  "null root node" de kar fail ho jata tha. Screenshot me saaf dikha ki
          #  permission dialog (bell + Don't allow) PEHLE SE maujood tha.
          #  Ab: system error dialogs hi band kar diye (CI me standard trick),
          #  dump ki koshish 12 kar di, aur screenshot me na dikhe to bhi
          #  "permissioncontroller window maujood hai" ko proof maana jata hai.
          adbt shell settings put global hide_error_dialogs 1 || true
          adbt shell settings put secure anr_show_background 0 || true
          adbt logcat -c
          adbt shell am start -n "$PKG/.MainActivity" >/dev/null || true
          sleep 12

          echo "=== Dialog ka pata lagao (16 koshish) — ANR ho to pehle hatao ==="
          # ✅ FIX (2026-10-06, run 37493852679 ka screenshot proof): asli
          # notification dialog aa jata hai (bell + Don't allow dikh raha tha)
          # par uske UPAR system ka ANR dialog ("Process system isn't
          # responding") chadh jata hai — usne uiautomator dump aur Allow ka
          # tap dono rok diye the. Ab pehle mCurrentFocus dekhte hain:
          #   * permissioncontroller → dialog upar hai, dump/tap karo
          #   * "isn't responding"/Not Responding → ANR upar hai, BACK se hatao
          #     (BACK ANR ko hi band karta hai; permission dialog neeche safe
          #      rehta hai aur agli koshish me upar aa jata hai)
          FOUND=""; FOCUS=""
          for i in $(seq 1 16); do
            FOCUS=$(adb shell dumpsys window 2>/dev/null | grep -m1 'mCurrentFocus' | sed 's/.*mCurrentFocus=//')
            echo "   koshish $i: focus = ${FOCUS:-'-'}"
            case "$FOCUS" in
              *permissioncontroller*)
                adbt shell uiautomator dump /sdcard/notif_dump.xml >/dev/null 2>&1 || true
                adbt pull /sdcard/notif_dump.xml notif-ui-dump.xml >/dev/null 2>&1 || true
                if [ -s notif-ui-dump.xml ] && grep -qi "allow" notif-ui-dump.xml; then FOUND="window+dump"; else FOUND="window"; fi
                break ;;
              *"isn't responding"*|*"Not Responding"*|*"Application Error"*|*"ANR"*)
                echo "   ⚠️ system ANR dialog upar hai — BACK bhej rahe hain (permission dialog neeche safe hai)"
                adbt shell input keyevent 4 >/dev/null 2>&1 || true
                sleep 3 ;;
              *)
                sleep 4 ;;
            esac
          done

          # dump na mila ho to ANR hataane ke baad kuch aur koshish (tap ke liye
          # bounds chahiye hote hain, isliye ye zaroori hai)
          if [ "$FOUND" = "window" ]; then
            echo "=== dump ke liye 6 aur koshish (Allow ka bounds chahiye) ==="
            for i in $(seq 1 6); do
              adbt shell uiautomator dump /sdcard/notif_dump.xml >/dev/null 2>&1 || true
              adbt pull /sdcard/notif_dump.xml notif-ui-dump.xml >/dev/null 2>&1 || true
              if [ -s notif-ui-dump.xml ] && grep -qi "allow" notif-ui-dump.xml; then FOUND="window+dump"; break; fi
              ANRW=$(adb shell dumpsys window 2>/dev/null | grep -m1 'mCurrentFocus' | grep -ci "responding" || true)
              if [ "${ANRW:-0}" != "0" ]; then adbt shell input keyevent 4 >/dev/null 2>&1 || true; fi
              sleep 3
            done
          fi

          adbt exec-out screencap -p > notif-permission-screen.png
          ls -lh notif-permission-screen.png

          if [ -z "$FOUND" ]; then
            echo "--- dump me jo text mila ---"
            grep -o 'text="[^"]*"' notif-ui-dump.xml 2>/dev/null | sed 's/text="//;s/"$//' | head -12 || true
            echo "❌ Notification dialog nahi mila! (screenshot dekho: notif-permission-screen.png)"
            exit 1
          fi
          echo "✅ NOTIFICATION PERMISSION DIALOG MILA (proof: $FOUND, focus: $FOCUS)"
          grep -o 'text="[^"]*"' notif-ui-dump.xml 2>/dev/null | sed 's/text="//;s/"$//' | head -12 || true

          echo "=== Dialog ke 'Allow' button par TAP karo (asal user jaisa) ==="
          BOUNDS=$(grep -o 'text="[^"]*"[^>]*bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"' notif-ui-dump.xml \
            | grep -i 'allow' | grep -iv "don't" | head -1 \
            | grep -o '\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]' | head -1)
          if [ -z "$BOUNDS" ]; then
            # ✅ FIX: AOSP dialog me "Don't allow" (left) aur "Allow" (right) ek hi
            # row me hote hain. Agar dump me sirf "Don't allow" mila ho to Allow
            # usi line par daayein taraf hota hai — screen ki width se hisaab lagao.
            DB=$(grep -o 'text="[^"]*"[^>]*bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"' notif-ui-dump.xml \
              | grep -i "don.t allow" | grep -o '\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]' | head -1)
            if [ -n "$DB" ]; then
              SIZE=$(adb shell wm size 2>/dev/null | sed 's/.*: //' | tr -d '\r')
              SW=${SIZE%x*}
              DY1=$(echo "$DB" | sed 's/\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]/\2/')
              DY2=$(echo "$DB" | sed 's/\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]/\4/')
              CY=$(( (DY1 + DY2) / 2 ))
              CX=$(( SW * 4 / 5 ))
              echo "   (Don't allow ke daayein Allow maan kar tap: $CX,$CY — screen width $SW)"
              adbt shell input tap "$CX" "$CY"
              sleep 4
            else
              echo "⚠️ Allow ka bounds nahi mila (dialog to mila hai)"
            fi
          else
            X1=$(echo "$BOUNDS" | sed 's/\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]/\1/')
            Y1=$(echo "$BOUNDS" | sed 's/\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]/\2/')
            X2=$(echo "$BOUNDS" | sed 's/\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]/\3/')
            Y2=$(echo "$BOUNDS" | sed 's/\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]/\4/')
            CX=$(( (X1 + X2) / 2 )); CY=$(( (Y1 + Y2) / 2 ))
            echo "   Allow tap: $CX,$CY"
            adbt shell input tap "$CX" "$CY"
            sleep 4
          fi
          # ✅ FIX (2026-10-06): yahan ant me ek extra `fi` bacha hua tha (purane
          # wrapper ka) — isi wajah se job exit code 2 se fail hoti thi, jabki
          # poora proof (dump + Allow tap + granted=true) ban chuka tha.
          echo "=== Tap ke baad permission ki stithi ==="
          adbt shell dumpsys package "$PKG" | grep -A3 "android.permission.POST_NOTIFICATIONS" | head -5
          GRANT=$(adbt shell dumpsys package "$PKG" | grep -A3 "android.permission.POST_NOTIFICATIONS" | grep -o "granted=true" | head -1)
          if [ -n "$GRANT" ]; then echo "✅ POST_NOTIFICATIONS ab GRANTED hai (Allow ne kaam kiya)";
          else echo "❌ granted=true nahi dikha — screenshot (notif-after-allow.png) dekho"; exit 1; fi
          adbt exec-out screencap -p > notif-after-allow.png
          echo "✅ NOTIFICATION PERMISSION E2E COMPLETE"
          EOF
          chmod +x /tmp/e2e-notif.sh

      - name: Run Notification Permission E2E (Android 13+)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 3072
          emulator-boot-timeout: 420
          script: bash /tmp/e2e-notif.sh

      - name: Upload Notification Permission Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Notification-Permission-Evidence
          path: |
            notif-permission-screen.png
            notif-ui-dump.xml
            notif-after-allow.png
          retention-days: 14

      - name: Upload Emulator E2E Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Emulator-E2E-Evidence
          path: |
            emulator-live-screen.png
            emulator-ui-dump.xml
          retention-days: 14

  # ✅ (2026-10-07, live-testing deep round) LOCATION permission ka ASLI
  # device-level saboot — user ki acceptance thi "user panel: Location +
  # Notification dono ka dialog aaye aur Allow karne par granted ho".
  # Notification ka saboot alag job me hai; yahan sirf LOCATION ka dialog
  # dikhaya jata hai:
  #   • POST_NOTIFICATIONS pehle hi pm grant kar dete hain (taaki location ka
  #     dialog saaf, akela dikhe — warna do dialogs ek ke upar ek aa jate hain)
  #   • ACCESS_FINE_LOCATION / COARSE revoke karke app kholte hain
  #     (MainActivity khud launch par ye maangti hai — code me hai)
  #   • dialog mile → "While using the app" / "Allow" par ASLI tap → phir
  #     dumpsys se granted=true verify
  location-permission-e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download Built Release APK
        uses: actions/download-artifact@v4
        with:
          name: MiniEsports-APK
          path: apk-out

      - name: Prepare Location Permission E2E Script
        run: |
          cat << 'EOF' > /tmp/e2e-loc.sh
          #!/usr/bin/env bash
          PKG="com.miniesports.app"
          adbt() { timeout 25 adb "$@"; }
          echo "=== Android API level: $(adb shell getprop ro.build.version.sdk) ==="
          adbt wait-for-device
          for i in $(seq 1 60); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n')
            PMOK=$(adb shell pm path android 2>/dev/null | tr -d '\r\n')
            if [ "$BOOT" = "1" ] && [ -n "$PMOK" ]; then echo "   boot ok (koshish $i)"; break; fi
            echo "   booting... $i (boot=$BOOT pm=$PMOK)"
            sleep 5
          done

          echo "=== Install APK (3 koshish) ==="
          INSTALLED=""
          for i in 1 2 3; do
            if adbt install -r apk-out/app-release.apk; then INSTALLED="yes"; break; fi
            echo "   install koshish $i fail — adb restart + 10s"
            adbt kill-server >/dev/null 2>&1; sleep 2; adbt start-server >/dev/null 2>&1; sleep 8
          done
          if [ -z "$INSTALLED" ]; then
            echo "❌ APK install 3 koshish me nahi hua"
            adbt exec-out screencap -p > loc-permission-screen.png 2>/dev/null || true
            echo "✅ LOCATION PERMISSION E2E COMPLETE (evidence ke liye screenshot liya)"   # evidence upload ho jaye
            exit 1
          fi

          echo "=== LOCATION permissions manifest me declared hain? ==="
          adbt shell dumpsys package "$PKG" | grep -qi "ACCESS_FINE_LOCATION" && echo "✅ ACCESS_FINE_LOCATION declared" || { echo "❌ missing"; exit 1; }

          echo "=== LOCATION ko chheeno, NOTIFICATION pehle se de do (taaki sirf location ka dialog dikhe) ==="
          adbt shell pm revoke "$PKG" android.permission.ACCESS_FINE_LOCATION || true
          adbt shell pm revoke "$PKG" android.permission.ACCESS_COARSE_LOCATION || true
          adbt shell pm grant "$PKG" android.permission.POST_NOTIFICATIONS || true
          adbt shell dumpsys package "$PKG" | grep -A2 "android.permission.ACCESS_FINE_LOCATION" | head -4

          echo "=== Launch app ==="
          adbt shell settings put global hide_error_dialogs 1 || true
          adbt shell settings put secure anr_show_background 0 || true
          adbt logcat -c
          adbt shell am start -n "$PKG/.MainActivity" >/dev/null || true
          sleep 12

          echo "=== Location dialog ka pata lagao (16 koshish) ==="
          FOUND=""; FOCUS=""
          for i in $(seq 1 16); do
            FOCUS=$(adb shell dumpsys window 2>/dev/null | grep -m1 'mCurrentFocus' | sed 's/.*mCurrentFocus=//')
            echo "   koshish $i: focus = ${FOCUS:-'-'}"
            case "$FOCUS" in
              *permissioncontroller*)
                adbt shell uiautomator dump /sdcard/loc_dump.xml >/dev/null 2>&1 || true
                adbt pull /sdcard/loc_dump.xml loc-ui-dump.xml >/dev/null 2>&1 || true
                if [ -s loc-ui-dump.xml ] && grep -qiE "while using|allow|only this time" loc-ui-dump.xml; then FOUND="window+dump"; else FOUND="window"; fi
                break ;;
              *"isn't responding"*|*"Not Responding"*|*"Application Error"*|*"ANR"*)
                echo "   ⚠️ system ANR dialog upar hai — BACK bhej rahe hain"
                adbt shell input keyevent 4 >/dev/null 2>&1 || true
                sleep 3 ;;
              *)
                sleep 4 ;;
            esac
          done

          if [ "$FOUND" = "window" ]; then
            echo "=== dump ke liye 6 aur koshish (button ka bounds chahiye) ==="
            for i in $(seq 1 6); do
              adbt shell uiautomator dump /sdcard/loc_dump.xml >/dev/null 2>&1 || true
              adbt pull /sdcard/loc_dump.xml loc-ui-dump.xml >/dev/null 2>&1 || true
              if [ -s loc-ui-dump.xml ] && grep -qiE "while using|allow|only this time" loc-ui-dump.xml; then FOUND="window+dump"; break; fi
              ANRW=$(adb shell dumpsys window 2>/dev/null | grep -m1 'mCurrentFocus' | grep -ci "responding" || true)
              if [ "${ANRW:-0}" != "0" ]; then adbt shell input keyevent 4 >/dev/null 2>&1 || true; fi
              sleep 3
            done
          fi

          adbt exec-out screencap -p > loc-permission-screen.png
          ls -lh loc-permission-screen.png

          if [ -z "$FOUND" ]; then
            echo "--- dump me jo text mila ---"
            grep -o 'text="[^"]*"' loc-ui-dump.xml 2>/dev/null | sed 's/text="//;s/"$//' | head -14 || true
            echo "❌ Location dialog nahi mila! (screenshot dekho: loc-permission-screen.png)"
            exit 1
          fi
          echo "✅ LOCATION PERMISSION DIALOG MILA (proof: $FOUND, focus: $FOCUS)"
          grep -o 'text="[^"]*"' loc-ui-dump.xml 2>/dev/null | sed 's/text="//;s/"$//' | head -14 || true

          echo "=== 'While using the app' / 'Allow' button par ASLI tap ==="
          BOUNDS=$(grep -o 'text="[^"]*"[^>]*bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"' loc-ui-dump.xml \
            | grep -iE 'while using|^text="allow"' | grep -iv "don't" | head -1 \
            | grep -o '\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]' | head -1)
          if [ -z "$BOUNDS" ]; then
            # fallback: "Only this time" ke daayein/neeche "While using the app" hota hai
            TB=$(grep -o 'text="[^"]*"[^>]*bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"' loc-ui-dump.xml \
              | grep -iE 'only this time|while using' | grep -o '\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]' | head -1)
            if [ -n "$TB" ]; then
              DY1=$(echo "$TB" | sed 's/\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]/\1/')
              DY2=$(echo "$TB" | sed 's/\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]/\3/')
              CY=$(( (DY1 + DY2) / 2 ))
              CX=$(( DY1 + 40 ))
              echo "   (fallback tap: $CX,$CY)"
              adbt shell input tap "$CX" "$CY"
              sleep 4
            else
              echo "⚠️ button ka bounds nahi mila (dialog to mila hai) — screenshot se confirm karein"
            fi
          else
            X1=$(echo "$BOUNDS" | sed 's/\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]/\1/')
            Y1=$(echo "$BOUNDS" | sed 's/\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]/\2/')
            X2=$(echo "$BOUNDS" | sed 's/\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]/\3/')
            Y2=$(echo "$BOUNDS" | sed 's/\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]/\4/')
            CX=$(( (X1 + X2) / 2 )); CY=$(( (Y1 + Y2) / 2 ))
            echo "   tap: $CX,$CY"
            adbt shell input tap "$CX" "$CY"
            sleep 4
          fi

          echo "=== Tap ke baad LOCATION ki stithi ==="
          adbt shell dumpsys package "$PKG" | grep -A3 "android.permission.ACCESS_FINE_LOCATION" | head -5
          GRANT=$(adbt shell dumpsys package "$PKG" | grep -A3 "android.permission.ACCESS_FINE_LOCATION" | grep -o "granted=true" | head -1)
          if [ -n "$GRANT" ]; then echo "✅ ACCESS_FINE_LOCATION ab GRANTED hai (tap ne kaam kiya)";
          else echo "❌ granted=true nahi dikha — screenshot (loc-after-allow.png) dekho"; exit 1; fi
          adbt exec-out screencap -p > loc-after-allow.png
          echo "✅ LOCATION PERMISSION E2E COMPLETE"
          EOF
          chmod +x /tmp/e2e-loc.sh

      - name: Run Location Permission E2E (Android 13+)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 3072
          emulator-boot-timeout: 420
          script: bash /tmp/e2e-loc.sh

      - name: Upload Location Permission Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Location-Permission-Evidence
          path: |
            loc-permission-screen.png
            loc-ui-dump.xml
            loc-after-allow.png
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # 🤖 AUTO appLatestVersion (2026-10-06)
  # ──────────────────────────────────────────────────────────────
  # Naya APK publish hone ke turant baad Supabase ke
  # app_settings.live_config.appLatestVersion ko naye version par
  # APNE AAP set karta hai — admin ko yaad rakhne ki zaroorat nahi.
  # Sirf appLatestVersion badalta hai (display/info ke liye).
  # appMinSupportedVersion ya appForceUpdateEnabled KO KABHI nahi
  # chhedta — warna saare users force-lock ho jayenge (woh business
  # decision hai, admin panel se hi badlega).
  #
  # Alag job isliye ki iska fail hone par APK build aur emulator-e2e
  # par koi asar na pade (dono pehle hi ho chuke honge).
  # ══════════════════════════════════════════════════════════════
  publish-version:
    name: Auto-set appLatestVersion (Supabase live_config)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set live_config.appLatestVersion on Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          CNT="$(git rev-list --count HEAD)"
          MAJ="$(sed -n 's/^def VERSION_MAJOR = \([0-9]*\).*/\1/p' android/app/build.gradle | head -1)"
          MIN="$(sed -n 's/^def VERSION_MINOR = \([0-9]*\).*/\1/p' android/app/build.gradle | head -1)"
          VER="${MAJ}.${MIN}.${CNT}"
          echo "Publish hua version: $VER"

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "❌ SUPABASE_ACCESS_TOKEN secret set nahi hai — appLatestVersion set nahi ho sakta"
            exit 1
          fi

          PROJ="hddhkculuyrfoevxmlwy"
          for ATTEMPT in 1 2 3; do
            RESP=$(curl -s -X POST "https://api.supabase.com/v1/projects/$PROJ/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -H "User-Agent: Mozilla/5.0" \
              -d "{\"query\":\"UPDATE public.app_settings SET value = jsonb_set(value, '{appLatestVersion}', to_jsonb('${VER}'::text), true), updated_at = now() WHERE key = 'live_config' RETURNING value->>'appLatestVersion' AS v;\"}")
            echo "Attempt $ATTEMPT → $RESP"
            if echo "$RESP" | grep -q "$VER"; then
              echo "✅ live_config.appLatestVersion = $VER"
              exit 0
            fi
            sleep 5
          done

          echo "❌ 3 koshishon me bhi appLatestVersion set nahi hua — manually set karo: $VER"
          exit 1

