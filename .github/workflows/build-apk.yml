name: Build Mini eSports APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # ══════════════════════════════════════════════════════════
          # AUTO-VERSION (R3 Phase-16): पूरी git history चाहिए — build.gradle
          # versionCode/versionName = git commit count से बनाता है। depth:1
          # (shallow) पर count=1 मिलता और Play-Store reject होता। यह
          # fetch-depth: 0 पूरा history लाता है।
          # ══════════════════════════════════════════════════════════
          fetch-depth: 0

      # ══════════════════════════════════════════════════════════
      # 🔢 VERSION SYNC GATE (2026-10-06)
      # ──────────────────────────────────────────────────────────
      # Har release par ye numbers badalne padte hain — ek bhi chhoota
      # to fix users tak pahunchta hi nahi (purani cache serve hoti
      # rehti hai; sw.js ke comments me yeh dard likha hua hai):
      #   index.html ke ~101 ?v=  |  sw.js ASSET_VER  |  sw.js CACHE_VER
      #   manifest.json  |  js/screens/features ke andar ke ?v=
      # scripts/version-sync.mjs yeh sab EK command me karti hai
      # (pre-commit hook bhi laga hua hai: bash scripts/install-hooks.sh).
      # Agar koi number pichhe chhoot gaya ho to BUILD YAHI ruk jayegi —
      # adhoori/stale release kabhi publish nahi hogi.
      # ══════════════════════════════════════════════════════════
      - name: Version Sync Gate (cache-busting numbers)
        run: |
          node scripts/version-sync.mjs --check --require-if-changed

      - name: Show auto-computed version
        run: |
          CNT="$(git rev-list --count HEAD)"
          MAJ="$(sed -n 's/^def VERSION_MAJOR = \([0-9]*\).*/\1/p' android/app/build.gradle | head -1)"
          MIN="$(sed -n 's/^def VERSION_MINOR = \([0-9]*\).*/\1/p' android/app/build.gradle | head -1)"
          echo "commit count  = $CNT"
          echo "versionCode   = $CNT"
          echo "versionName   = ${MAJ:-?}.${MIN:-?}.$CNT"
          echo "(build.gradle defaultConfig इन्हीं से बनता है — कोई manual bump नहीं)"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      # ══════════════════════════════════════════════════════════
      # KEYSTORE STRATEGY
      # ──────────────────────────────────────────────────────────
      # PEHLI BAAR: Naya keystore generate hoga → SHA-1 logs mein
      #   dikhega → use Firebase Console mein register karo
      #   → keystore artifact download karo → base64 karo
      #   → KEYSTORE_B64 secret mein save karo
      #
      # BAAD MEIN: KEYSTORE_B64 secret se same keystore use hoga
      #   → same SHA-1 → Google login kaam karega
      # ══════════════════════════════════════════════════════════

      - name: Setup Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            # ── Saved keystore use karo (same SHA-1 every build) ──
            echo "✅ Saved keystore found — using it"
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android/app/keystore.jks
          else
            # ── First time: Naya keystore generate karo ──
            # 🔒 R29E P0-FIX (2026-09-22): build fail kar do, silently naya
            #    keystore GEN nahi — naye key se SHA-1 badal jata hai (Google
            #    login/firebase break) aur keyloc दो अलग-अलग app-identity
            #    ban jati hai. Pehle secret set karo, phir build.
            echo "❌ KEYSTORE_B64 secret set nahi hai — pehle secret sahi"
            echo "   se save karo (repo secrets), phir build chalao."
            echo "   Naya keystore yahan generate NAHI hota (R29E fix)."
            exit 1
          fi
          echo "Keystore ready:" && ls -lh android/app/keystore.jks

      # ── SHA-1 print karo — Firebase Console mein register karo ──
      - name: Print SHA-1 (Firebase Console → Android App → Add Fingerprint)
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  GOOGLE LOGIN FIX — Yeh SHA-1 copy karo"
          echo "  Firebase Console → fft-app-1e283 → Project Settings"
          echo "  → Your Apps → Android App → Add Fingerprint"
          echo "════════════════════════════════════════════════════════"
          keytool -list -v \
            -keystore android/app/keystore.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias    "${{ secrets.KEY_ALIAS }}" \
            | grep -E "SHA1:|SHA256:" | head -4
          echo "════════════════════════════════════════════════════════"
          echo ""

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniEsports-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish Latest APK to GitHub Releases (Direct Download URL)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CNT="$(git rev-list --count HEAD)"
          TAG="v1.0.${CNT}"
          cp android/app/build/outputs/apk/release/app-release.apk MiniEsports.apk
          gh release create "$TAG" MiniEsports.apk \
            --title "Mini eSports $TAG (Official APK)" \
            --notes "Auto-published signed release APK ($TAG) for Force Update & direct download." \
            --latest || \
          gh release upload "$TAG" MiniEsports.apk --clobber

      # ── 🔒 R29E P0-FIX (2026-09-22): Keystore artifact upload REMOVED — ye
      #    signing key ko publically downloadable artifact bana deta tha
      #    (koi bhi contributor APK sign + update-push kar sakta tha). Keystore
      #    ab SIRF KEYSTORE_B64 secret me rahega, artifact me kabhi nahi. ──

      - name: Build Release AAB (Play Store)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MiniEsports-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

  emulator-e2e:
    name: Live Android Emulator APK E2E Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download Built Release APK
        uses: actions/download-artifact@v4
        with:
          name: MiniEsports-APK
          path: apk-out

      - name: Prepare Emulator E2E Script
        run: |
          cat << 'EOF' > /tmp/e2e-emulator.sh
          #!/usr/bin/env bash
          set -e
          PKG="com.miniesports.app"
          echo "=== 1. Installing Release APK on Live Android Emulator ==="
          adb install -r apk-out/app-release.apk
          adb shell pm list packages | grep "$PKG"

          echo "=== 2. Verifying Installed Version & REQUEST_INSTALL_PACKAGES Permission ==="
          adb shell dumpsys package "$PKG" | grep -E "versionCode|versionName|REQUEST_INSTALL_PACKAGES"

          echo "=== 3. Launching Mini eSports MainActivity on Emulator ==="
          adb logcat -c
          adb shell am start -W -n "$PKG/.MainActivity"
          sleep 12

          echo "=== 4. Verify Process is Alive & Zero Fatal Crash ==="
          PID=$(adb shell pidof "$PKG" | tr -d '\r')
          echo "Running PID: $PID"
          if [ -z "$PID" ]; then
            echo "❌ App process not running!"
            adb logcat -d | tail -n 120
            exit 1
          fi
          if adb logcat -d | grep -E "FATAL EXCEPTION.*$PKG"; then
            echo "❌ Fatal exception detected in logcat!"
            exit 1
          fi

          echo "=== 5. Verify WebView Loaded & Capture Live Emulator Screenshot + UI Hierarchy ==="
          adb shell uiautomator dump /sdcard/window_dump.xml || true
          adb pull /sdcard/window_dump.xml emulator-ui-dump.xml || true
          adb exec-out screencap -p > emulator-live-screen.png
          ls -lh emulator-live-screen.png
          echo "✅ LIVE ANDROID EMULATOR APK E2E VERIFIED!"
          EOF
          chmod +x /tmp/e2e-emulator.sh

      - name: Run APK on Android Emulator & Verify E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash /tmp/e2e-emulator.sh

      - name: Upload Emulator E2E Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Emulator-E2E-Evidence
          path: |
            emulator-live-screen.png
            emulator-ui-dump.xml
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # 🤖 AUTO appLatestVersion (2026-10-06)
  # ──────────────────────────────────────────────────────────────
  # Naya APK publish hone ke turant baad Supabase ke
  # app_settings.live_config.appLatestVersion ko naye version par
  # APNE AAP set karta hai — admin ko yaad rakhne ki zaroorat nahi.
  # Sirf appLatestVersion badalta hai (display/info ke liye).
  # appMinSupportedVersion ya appForceUpdateEnabled KO KABHI nahi
  # chhedta — warna saare users force-lock ho jayenge (woh business
  # decision hai, admin panel se hi badlega).
  #
  # Alag job isliye ki iska fail hone par APK build aur emulator-e2e
  # par koi asar na pade (dono pehle hi ho chuke honge).
  # ══════════════════════════════════════════════════════════════
  publish-version:
    name: Auto-set appLatestVersion (Supabase live_config)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set live_config.appLatestVersion on Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          CNT="$(git rev-list --count HEAD)"
          MAJ="$(sed -n 's/^def VERSION_MAJOR = \([0-9]*\).*/\1/p' android/app/build.gradle | head -1)"
          MIN="$(sed -n 's/^def VERSION_MINOR = \([0-9]*\).*/\1/p' android/app/build.gradle | head -1)"
          VER="${MAJ}.${MIN}.${CNT}"
          echo "Publish hua version: $VER"

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "❌ SUPABASE_ACCESS_TOKEN secret set nahi hai — appLatestVersion set nahi ho sakta"
            exit 1
          fi

          PROJ="hddhkculuyrfoevxmlwy"
          for ATTEMPT in 1 2 3; do
            RESP=$(curl -s -X POST "https://api.supabase.com/v1/projects/$PROJ/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -H "User-Agent: Mozilla/5.0" \
              -d "{\"query\":\"UPDATE public.app_settings SET value = jsonb_set(value, '{appLatestVersion}', to_jsonb('${VER}'::text), true), updated_at = now() WHERE key = 'live_config' RETURNING value->>'appLatestVersion' AS v;\"}")
            echo "Attempt $ATTEMPT → $RESP"
            if echo "$RESP" | grep -q "$VER"; then
              echo "✅ live_config.appLatestVersion = $VER"
              exit 0
            fi
            sleep 5
          done

          echo "❌ 3 koshishon me bhi appLatestVersion set nahi hua — manually set karo: $VER"
          exit 1

