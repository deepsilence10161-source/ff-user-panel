name: E2E Emulator (har screen live test)

# ================================================================
#  MINI eSPORTS — EMULATOR E2E   (2026-10-12)
# ================================================================
#  KYU: "har kaam ka e2e live proof" niyam ka hissa. Ye workflow asli
#  Android emulator (hardware-accelerated KVM) par:
#    1. WAHI RELEASE APK install karta hai jo users ko jaati hai
#       (Build APK workflow ka artifact MiniEsports-APK)
#    2. app launch karke live GitHub Pages UI load karta hai
#    3. har bottom-nav screen ka screenshot leta hai
#    4. asset-e2e.html (60 images) aur screen-e2e.html (har badge /
#       ribbon / gallery render) ko intent se chala kar unka
#       deterministic PASS/FAIL logcat se uthata hai
#    5. sab screenshots + logcat artifacts me upload karta hai
#
#  ⚠️ 2026-10-12 KA BADA SABAK: pehle yahan DEBUG APK build hoti thi.
#  App ka apna anti-tamper guard debug build ko BLOCK kar deta hai:
#     "AppGuard: ⛔ BLOCKED: app is debuggable — tampered build"
#  Isliye ab sirf RELEASE APK test hoti hai — wo bhi bilkul wahi file
#  jo GitHub Releases par users ko milti hai.
#
#  TRIGGER: Build Mini eSports APK workflow poora hone par (success),
#  ya manually (Actions → Run workflow; apk_url se koi bhi APK).
#
#  NOTE: GitHub ka ubuntu-latest runner /dev/kvm deta hai — isliye
#  neeche KVM udev permission step zaroori hai (warna emulator
#  software-mode me chalta hai aur bahut slow hota hai).
# ================================================================

on:
  workflow_run:
    workflows: ["Build Mini eSports APK"]     # usi commit ki release APK test hogi
    types: [completed]
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK URL (khaali chhodo = latest release APK)'
        required: false
        default: ''

concurrency:
  group: e2e-emulator-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    # Build APK fail hui ho to E2E ka koi matlab nahi
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (jis commit ki APK test karni hai)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # ── Web tests pehle (fast fail — emulator se pehle sasta filter) ──
      - name: Web Tests (smoke + asset + screen E2E)
        run: |
          node tests/run-smoke-tests.js
          node tests/asset-e2e.js
          node tests/screen-e2e.js

      # ── GitHub Pages live hona chahiye (E2E pages wahin se load hote hain) ──
      - name: GitHub Pages ka intezar (E2E pages live hon)
        run: |
          BASE=https://deepsilence10161-source.github.io/ff-user-panel
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/screen-e2e.html" || true)
            code2=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/asset-e2e.html" || true)
            echo "try $i: screen-e2e=$code asset-e2e=$code2"
            [ "$code" = "200" ] && [ "$code2" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::GitHub Pages par E2E pages 5 min me live nahi hue"
          exit 1

      # ── ASLI release APK: Build APK workflow ke artifact se ──
      - name: Release APK download (Build APK ka MiniEsports-APK)
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: MiniEsports-APK
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk-dl

      - name: APK ko root me laao (script isi path se uthata hai)
        run: |
          # ⚠️ Repo me ek purani MiniEsports.apk COMMITTED hai (get.html ka
          # self-hosted download) — usse pehle saaf karo, warna galat file
          # test ho jaati hai (2026-10-12 ko yahi hua tha).
          rm -f MiniEsports.apk
          if [ -n "${{ github.event.inputs.apk_url }}" ]; then
            echo "Manual APK URL se aa rahi hai…"
            curl -fL -o MiniEsports.apk "${{ github.event.inputs.apk_url }}"
          elif [ -d apk-dl ]; then
            f=$(find apk-dl -name "*.apk" | head -1)
            echo "Build APK artifact se: $f"
            cp "$f" MiniEsports.apk
          else
            echo "Latest GitHub Release se aa rahi hai…"
            curl -fL -o MiniEsports.apk \
              "https://github.com/${{ github.repository }}/releases/latest/download/MiniEsports.apk"
          fi
          ls -la MiniEsports.apk
          sha256sum MiniEsports.apk

      # ── KVM (emulator hardware acceleration) ──
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      # ── Emulator + poora E2E ──
      - name: Emulator E2E (install → launch → screens → asset/screen E2E)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: e2e_avd
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: bash .github/scripts/emulator-e2e.sh

      # ── Saboot (screenshots + logcat) — FAIL hua to bhi upload ──
      - name: Artifacts upload (screens + logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-emulator-proof
          path: e2e-artifacts/
          if-no-files-found: warn
          retention-days: 30
