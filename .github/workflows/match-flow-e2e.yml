name: match-flow-e2e

# ═══════════════════════════════════════════════════════════════════════════
#  MATCH-FLOW E2E — owner ke Free Fire screenshots wale EXACT 7 usernames
#  (KESHAV·SAINi, Wail160g0_9, Linox모444.., મેહુલવસાવા1, hjVikram, AKGINMG,
#  N0dc21b349c3) ke saath poora match lifecycle LIVE:
#  create (3 types × modes + negatives) → join (solo/duo/squad, fee splits,
#  team consent, gift) → room (set/release/confirm/chat) → cancel+refunds →
#  result staging (owner ka REAL kill data) → admin publish → correction →
#  rate → history. Sab accounts run-tagged; cleanup job hamesha chalta hai.
# ═══════════════════════════════════════════════════════════════════════════
on:
  workflow_dispatch:
    inputs:
      run_tag:
        description: "Run tag (khali = auto timestamp)"
        required: false
        default: ""

concurrency:
  group: match-flow-e2e
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.mkrun.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: mkrun
        run: |
          TAG="${{ github.event.inputs.run_tag }}"
          [ -z "$TAG" ] && TAG="$(date -u +%m%d%H%M%S)"
          echo "run=$TAG" >> "$GITHUB_OUTPUT"
          echo "RUN=$TAG"
      - name: QA accounts banao (7 exact IGN + creator + admin + bench)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MF_SALT: ${{ secrets.TRI_SALT }}
        run: |
          node tools/match-flow/accounts7.mjs --create --run "${{ steps.mkrun.outputs.run }}" --out /tmp/mf-state.json
      - uses: actions/upload-artifact@v4
        with:
          name: mf-state-${{ steps.mkrun.outputs.run }}
          path: /tmp/mf-state.json
          retention-days: 2

  drive:
    needs: seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: mf-state-${{ needs.seed.outputs.run }}
          path: /tmp/mfst
      - name: Playwright install
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Match-flow driver chalao (asli UI + asli server)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 tools/match-flow/match_driver.py \
            --run "${{ needs.seed.outputs.run }}" \
            --state /tmp/mfst/mf-state.json \
            --out /tmp/mf-out.json \
            --shots mf-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mf-shots-${{ needs.seed.outputs.run }}
          path: |
            mf-shots/
            /tmp/mf-out.json
          retention-days: 7

  cleanup:
    needs: [seed, drive]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mf-state-${{ needs.seed.outputs.run }}
          path: /tmp/mfst
      - name: Sab QA data delete karo (0 residue)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MF_SALT: ${{ secrets.TRI_SALT }}
        run: |
          node tools/match-flow/accounts7.mjs --cleanup --run "${{ needs.seed.outputs.run }}" --out /tmp/mfst/mf-state.json
