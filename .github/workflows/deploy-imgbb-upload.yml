name: Deploy image upload function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-imgbb-upload.yml"
      - "supabase/config.toml"
      - "supabase/functions/imgbb-upload/**"

permissions:
  contents: read

concurrency:
  group: deploy-imgbb-upload-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ImgBB upload function
    runs-on: ubuntu-latest

    env:
      PROJECT_REF: hddhkculuyrfoevxmlwy
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      IMGBB_KEY: ${{ secrets.IMGBB_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Supabase deployment credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret missing hai."
            echo "::error::Repository Settings > Secrets and variables > Actions mein secret add karo."
            exit 1
          fi

          echo "Supabase deployment credentials available."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show Supabase CLI version
        shell: bash
        run: supabase --version

      - name: Sync optional ImgBB secret
        if: ${{ env.IMGBB_KEY != '' }}
        shell: bash
        run: supabase secrets set IMGBB_KEY="$IMGBB_KEY" FIREBASE_PROJECT_ID=fft-app-1e283 --project-ref "$PROJECT_REF"

      - name: Deploy imgbb-upload
        shell: bash
        run: supabase functions deploy imgbb-upload --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Verify deployment and gateway configuration
        shell: bash
        run: |
          URL="https://${PROJECT_REF}.supabase.co/functions/v1/imgbb-upload"
          BODY_FILE="$(mktemp)"

          STATUS="$(curl --silent --show-error --output "$BODY_FILE" --write-out "%{http_code}" --request POST "$URL" --header "Content-Type: text/plain;charset=UTF-8" --data '{"image":"QUJD","name":"deployment-health-check"}')"

          BODY="$(cat "$BODY_FILE")"

          echo "Health-check HTTP status: $STATUS"
          echo "Health-check response: $BODY"

          if echo "$BODY" | grep -q "UNAUTHORIZED_NO_AUTH_HEADER"; then
            echo "::error::Supabase gateway JWT verification abhi bhi enabled hai."
            echo "::error::imgbb-upload ko --no-verify-jwt ke saath deploy hona chahiye."
            exit 1
          fi

          if [ "$STATUS" != "401" ]; then
            echo "::error::Expected HTTP 401 from function authentication check, lekin HTTP $STATUS mila."
            exit 1
          fi

          if ! echo "$BODY" | grep -q "Login required"; then
            echo "::error::Request function code tak nahi pahunchi ya unexpected response mila."
            exit 1
          fi

          echo "Image upload function successfully deployed."
          echo "Gateway JWT verification disabled hai."
          echo "Function-level Firebase authentication correctly active hai."
