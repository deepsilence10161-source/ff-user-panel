name: Deploy image upload function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-imgbb-upload.yml"
      - "supabase/config.toml"
      - "supabase/functions/imgbb-upload/**"
      - "supabase/functions/push-send/**"
      - "supabase/functions/push-token/**"

permissions:
  contents: read

concurrency:
  group: deploy-imgbb-upload-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ImgBB upload function
    runs-on: ubuntu-latest

    env:
      PROJECT_REF: hddhkculuyrfoevxmlwy
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      IMGBB_KEY: ${{ secrets.IMGBB_KEY }}
      ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
      ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
      ONESIGNAL_TRIGGER_SECRET: ${{ secrets.ONESIGNAL_TRIGGER_SECRET }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkZGhrY3VsdXlyZm9ldnhtbHd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NTQ1MTgsImV4cCI6MjA5NDAzMDUxOH0.2hhDGez1fVFjS5ljSU3tSOEJuusLmQpERjcrh45T7po' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Supabase deployment credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret missing hai."
            echo "::error::Repository Settings > Secrets and variables > Actions mein secret add karo."
            exit 1
          fi

          echo "Supabase deployment credentials available."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show Supabase CLI version
        shell: bash
        run: supabase --version

      - name: Sync optional ImgBB secret
        if: ${{ env.IMGBB_KEY != '' }}
        shell: bash
        run: supabase secrets set IMGBB_KEY="$IMGBB_KEY" FIREBASE_PROJECT_ID=fft-app-1e283 --project-ref "$PROJECT_REF"

      - name: Sync optional OneSignal secrets
        if: ${{ env.ONESIGNAL_APP_ID != '' }}
        shell: bash
        run: supabase secrets set ONESIGNAL_APP_ID="$ONESIGNAL_APP_ID" ONESIGNAL_REST_KEY="$ONESIGNAL_REST_KEY" ONESIGNAL_TRIGGER_SECRET="$ONESIGNAL_TRIGGER_SECRET" --project-ref "$PROJECT_REF"

      # FCM (2026-10-31): service-account key = push-send ka OAuth2 signing key.
      # Rotation: GH repo secret FIREBASE_SERVICE_ACCOUNT_JSON badlo → yeh
      # workflow (push/dispatch) chalega → Supabase secret apne aap sync.
      - name: Sync Firebase FCM service-account secret
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        shell: bash
        run: supabase secrets set FIREBASE_SERVICE_ACCOUNT_JSON="$FIREBASE_SERVICE_ACCOUNT_JSON" --project-ref "$PROJECT_REF"

      - name: Deploy imgbb-upload
        shell: bash
        run: supabase functions deploy imgbb-upload --project-ref "$PROJECT_REF" --no-verify-jwt

      # R29E P1-FIX (2026-09-22): push-send ab source-push par auto-deploy hota hai
      # (pehle sirf manual deploy tha). Gateway verify_jwt DEFAULT (ON) rakha —
      # DB trigger (notifications_push_hook) apikey (anon key, valid Supabase JWT)
      # bhejta hai; direct public call x-push-secret guard se 403 hoti hai.
      - name: Deploy push-send
        shell: bash
        run: supabase functions deploy push-send --project-ref "$PROJECT_REF"

      # push-token (FCM migration, 2026-10-31): client token registration —
      # verify_jwt OFF (imgbb jaisa gateway pass-through; function-level
      # Firebase-idToken RS256 auth hi asli gate hai).
      - name: Deploy push-token
        shell: bash
        run: supabase functions deploy push-token --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Verify deployment and gateway configuration
        shell: bash
        run: |
          URL="https://${PROJECT_REF}.supabase.co/functions/v1/imgbb-upload"
          BODY_FILE="$(mktemp)"
          # R29E P1-FIX (2026-09-22): health-check ab PUBLIC anon apikey ke
          # saath POST karta hai (wahi key jo client code me embedded hai) —
          # isliye gateway verify_jwt ON ya OFF dono me function tak
          # pahunchta hai. Function-level auth (Firebase ID token verify)
          # hi asli gate hai; bina FB token ke "Login required" 401 aana
          # chahiye.
          STATUS="$(curl --silent --show-error --output "$BODY_FILE" --write-out "%{http_code}" --request POST "$URL" \
            --header "Content-Type: application/json" \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --data '{"image":"QUJD","name":"deployment-health-check"}')"

          BODY="$(cat "$BODY_FILE")"

          echo "Health-check HTTP status: $STATUS"
          echo "Health-check response: $BODY"

          if [ "$STATUS" != "401" ]; then
            echo "::error::Expected HTTP 401 from function authentication check, lekin HTTP $STATUS mila."
            exit 1
          fi

          if ! echo "$BODY" | grep -q "Login required"; then
            echo "::error::Request function code tak nahi pahunchi ya unexpected response mila."
            exit 1
          fi

          echo "Image upload function successfully deployed."
          echo "Function-level Firebase authentication correctly active hai."

          # push-token (FCM migration) ka auth-gate bhi verify karo:
          # bina identity 401 "Login required" aana chahiye.
          PT_URL="https://${PROJECT_REF}.supabase.co/functions/v1/push-token"
          PT_STATUS="$(curl --silent --output "$BODY_FILE" --write-out "%{http_code}" --request POST "$PT_URL" \
            --header "Content-Type: application/json" \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --data '{"action":"set","platform":"web","token":"healthcheck-token-000000"}')"
          PT_BODY="$(cat "$BODY_FILE")"
          echo "push-token health: HTTP $PT_STATUS — $PT_BODY"
          if [ "$PT_STATUS" != "401" ] || ! echo "$PT_BODY" | grep -q "Login required"; then
            echo "::error::push-token auth gate galat jawab de raha hai (401 Login required chahiye tha)."
            exit 1
          fi
          echo "push-token auth gate verified (401 Login required bina identity ke)."
