name: Update Flow E2E (download → install → auto-delete)

# ================================================================
#  MINI eSPORTS — UPDATE-FLOW E2E   (2026-10-29)
# ================================================================
#  KYU: user-panel ke download/update system ka POORA user-flow asli
#  Android emulator par prove karna — exactly wahi rasta jo user
#  leta hai:
#    1. purana release APK install (jo aaj users ke phone me hai)
#    2. app launch → server policy (Supabase apk_cleanup) verdict cache
#    3. ek-baari "install unknown apps" toggle (appops se simulate —
#       user wahi ek baar Settings me karta hai)
#    4. miniesports://update deep-link (web page ka "App me update
#       karein" button) → in-app downloader → app-private updates/
#    5. system installer → Update tap → naya APK install
#    6. PROOF: install ke baad updates/ ka APK auto-delete (logcat +
#       adb root ls), /sdcard/Download me koi MiniEsports file NAHI,
#       aur galat host ka deep-link allowlist se REFUSED
#
#  Ye workflow build NAHI karta — jis commit par dispatch kiya jaye,
#  usi commit ki live GitHub Pages APK (committed MiniEsports.apk)
#  naya version hoti hai aur pichhli release purana version.
#
#  TRIGGER: manual (Actions → Run workflow). Merge ke baad main SHA
#  par chalaya jata hai taaki base=naya build, old=pichhli release ho.
# ================================================================

on:
  workflow_dispatch:
    inputs:
      new_apk_url:
        description: 'Naye APK ka public URL (khaali = live GitHub Pages APK)'
        required: false
        default: ''
      old_tag:
        description: 'Old base release tag pin karo (khaali = pichhli release). Buggy-base rescue proof ke liye e.g. v1.0.300'
        required: false
        default: ''

concurrency:
  group: update-flow-e2e-${{ github.sha }}
  cancel-in-progress: true

jobs:
  update-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: QA account create (tri-e2e infra — run ke ant me delete)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TRI_SALT: ${{ secrets.TRI_SALT }}
        run: |
          RUNID="u$(date -u +%H%M%S)"
          node tools/tri-e2e/qa-accounts.mjs create --run "$RUNID" > /tmp/qa-create.txt 2>&1 || { tail -20 /tmp/qa-create.txt; exit 1; }
          python3 - >> $GITHUB_ENV <<'PY'
          import json, glob
          st = json.load(open(sorted(glob.glob('tools/tri-e2e/.state/*.json'))[-1]))
          print("TRI_RUNID=" + st["runid"])
          print("TRI_EMAIL=" + st["player"]["email"])
          print("TRI_PASS=" + st["player"]["password"])
          PY
          echo "QA account ready (creds env me, log me nahi)"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Update-Flow E2E (old APK → deep-link update → install → auto-delete proofs)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_APK_URL: ${{ github.event.inputs.new_apk_url }}
          OLD_TAG_INPUT: ${{ github.event.inputs.old_tag }}
          TRI_EMAIL: ${{ env.TRI_EMAIL }}
          TRI_PASS: ${{ env.TRI_PASS }}
          TRI_RUNID: ${{ env.TRI_RUNID }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: upd_avd
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: bash .github/scripts/update-flow-e2e.sh

      - name: Artifacts upload (logs + dumps)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-flow-proof
          path: e2e-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: QA cleanup (residue 0 — hamesha)
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TRI_SALT: ${{ secrets.TRI_SALT }}
        run: |
          [ -n "${TRI_RUNID:-}" ] || { echo "RUNID nahi tha — cleanup skip"; exit 0; }
          node tools/tri-e2e/qa-accounts.mjs cleanup --run "$TRI_RUNID" || echo "QA cleanup me dikkat — manually dekhein"
