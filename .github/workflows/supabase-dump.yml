name: supabase-dump

# READ-ONLY diagnostic dump — repo ke supabase/**.sql file ko Management API
# se chalata hai aur poora result job log me print karta hai (function defs,
# pg_policies, constraints). Koi write nahi; supabase-sql.yml alag hai.
on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: "supabase/... .sql (read-only dump)"
        required: true
        default: "supabase/diag/20261030_match_fns_dump.sql"

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dump (Management API, full output)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node tools/supabase-dump.mjs "${{ github.event.inputs.sql_file }}"
