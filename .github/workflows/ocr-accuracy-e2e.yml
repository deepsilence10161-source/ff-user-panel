name: ocr-accuracy-e2e

# ═══════════════════════════════════════════════════════════════════════════
#  OCR-ACCURACY LIVE E2E — owner ke ASLI Free Fire screenshots (2 result +
#  1 lobby) admin panel ke FA53 Tesseract.js v7 auto-fill pipeline me:
#  Match Result section → match select → screenshot upload → auto OCR →
#  rank/kills fill → ground-truth se accuracy. Lobby: OCR Verify auto-ticks.
#  Fixtures PRIVATE repo se aate hain (secrets.FIXTURES_PAT) — owner data
#  public repo me kabhi nahi jaata.
# ═══════════════════════════════════════════════════════════════════════════
on:
  workflow_dispatch:
    inputs:
      run_tag:
        description: "Run tag (khali = auto timestamp)"
        required: false
        default: ""

concurrency:
  group: ocr-accuracy-e2e
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.mkrun.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: mkrun
        run: |
          TAG="${{ github.event.inputs.run_tag }}"
          [ -z "$TAG" ] && TAG="$(date -u +%m%d%H%M%S)"
          echo "run=$TAG" >> "$GITHUB_OUTPUT"
          echo "RUN=$TAG"
      - name: Fixtures repo se (tools/match-flow/fixtures)
        run: |
          mkdir -p ocr-fixtures && cp tools/match-flow/fixtures/ocr-res-1.jpg tools/match-flow/fixtures/ocr-res-2.jpg tools/match-flow/fixtures/ocr-lobby.jpg ocr-fixtures/ && ls -la ocr-fixtures/
      - name: OCR accuracy driver (asli Tesseract, asli admin UI)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 tools/match-flow/ocr_driver.py \
            --state /tmp/mfst/mf-state.json \
            --fixtures ocr-fixtures \
            --shots ocr-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-shots-${{ needs.seed.outputs.run }}
          path: ocr-shots/
          retention-days: 7

  cleanup:
    needs: [seed, drive]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ocr-state-${{ needs.seed.outputs.run }}
          path: /tmp/mfst
      - name: QA accounts + residue cleanup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MF_SALT: ${{ secrets.TRI_SALT }}
        run: |
          node tools/match-flow/accounts7.mjs --cleanup --run "${{ needs.seed.outputs.run }}" --out /tmp/mfst/mf-state.json || true
          echo "MF-CLEANUP-DONE"
