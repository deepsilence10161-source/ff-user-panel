<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TRI E2E — Admin Panel ↔ User Panel ↔ APK</title>
<style>
  :root{--gold:#ffd700;--green:#00ff9c;--red:#ff4d4d;--cyan:#00d4ff;--bg:#06060c;--card:#12122a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:#eaeaea;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #wrap{padding:10px 12px 24px}
  h1{font-size:19px;line-height:1.2;margin:4px 0 2px;color:var(--gold);font-weight:900}
  .sub{font-size:11px;color:#9aa;margin-bottom:8px}
  .big{font-size:15px;font-weight:900;margin:8px 0 4px;color:var(--green)}
  .big.fail{color:var(--red)}
  ol{list-style:none;margin:6px 0 0;padding:0}
  li{background:var(--card);border:1px solid #23233f;border-radius:10px;padding:7px 9px;margin-bottom:5px;font-size:11.5px;line-height:1.35}
  li .nm{font-weight:800;color:#fff}
  li .dt{color:#9aa;display:block;margin-top:2px;word-break:break-word}
  li.ok{border-color:rgba(0,255,156,.45)} li.ok .nm:before{content:"✅ "}
  li.bad{border-color:rgba(255,77,77,.5)} li.bad .nm:before{content:"❌ "}
  li.run{border-color:rgba(0,212,255,.5)} li.run .nm:before{content:"⏳ "}
  #frameBox{margin-top:10px;border:1px solid #23233f;border-radius:12px;overflow:hidden;background:#000}
  #frameBox .hdr{font-size:10px;color:#9aa;padding:4px 8px;background:#0d0d1e}
  iframe{width:100%;height:520px;border:0;background:#000}
  #values{font-size:10px;color:#8f8;white-space:pre-wrap;word-break:break-all;margin-top:6px}
</style>
</head>
<body>
<div id="wrap">
  <h1>TRI E2E — teeno ke beech poora flow</h1>
  <div class="sub">Admin Panel ↔ User Panel (web) ↔ User Panel (APK) · asli Firebase + Supabase · run <b id="runid">?</b></div>
  <div id="result" class="big">… chal raha hai</div>
  <ol id="list"></ol>
  <div id="frameBox">
    <div class="hdr">asli app (index.html) isi WebView me — asli session ke saath</div>
    <iframe id="appFrame" src="about:blank"></iframe>
  </div>
  <div id="values"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   TRI-E2E (APK side) — 2026-10-12
   ---------------------------------------------------------------------------
   Ye page APK ke WebView me khulta hai (MainActivity ka E2E intent allowlist:
   asset-e2e.html | screen-e2e.html | tri-e2e.html). Iska kaam:

     1. QA player ke roop me ASLI Firebase login (email/password) — wahi user
        jo host driver admin panel me dekh raha hai.
     2. Usi WebView me ASLI app (index.html) iframe me kholna — app khud
        onAuthStateChanged se login karta hai (koi test-only auth nahi).
     3. App ke ASLI functions se: support ticket submit, wallet/notif/matches
        refresh, My-Tickets modal — sab real code paths.
     4. Admin panel ke actions ka intezaar (DB poll) — reply, wallet credit,
        match, notification — aur unhe APK me verify karna.
     5. Logcat me saaf markers + aakhir me TRI-E2E-RESULT + TRI-E2E-VALUES.

   Credentials URL ke #fragment me aate hain (server ko nahi jaate) — QA
   account har run me naya banta hai aur run ke ant me delete ho jaata hai.
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  var FIREBASE_CFG = {
    apiKey: "AIzaSyA-v9AYigDrg96D_fos0vOW3wU2GY2UYec",
    authDomain: "fft-app-1e283.firebaseapp.com",
    databaseURL: "https://fft-app-1e283-default-rtdb.firebaseio.com",
    projectId: "fft-app-1e283",
    storageBucket: "fft-app-1e283.appspot.com",
    messagingSenderId: "247829466483",
    appId: "1:247829466483:web:6961488f1d3c4e3fff4906"
  };
  var Q = {};
  (location.hash || '').replace(/^#/, '').split('&').forEach(function (kv) {
    var i = kv.indexOf('='); if (i > 0) Q[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
  });
  var RUN = Q.run || 'norun', EMAIL = Q.e || '', PASS = Q.p || '';
  var MARK = 'QA-TEST TRI ' + RUN;
  var VALUES = {};
  var results = [];
  document.getElementById('runid').textContent = RUN;

  function logStep(nm, detail, ok) { console.log('TRI-E2E-STEP: ' + nm + ' — ' + detail); }
  function fail(nm, err) { throw new Error(nm + ': ' + ((err && err.message) || err)); }

  /* ⚠️ 2026-10-16: run 38928942155 me step 9 ka fail sirf itna bola —
     "Cannot read property 'id' of undefined" — par kahan se aaya, pata nahi.
     Is liye page par hi error/rejection hooks: har throw ka message + file:line
     + poora stack console par aayega (logcat me). */
  window.addEventListener('error', function (e) {
    try {
      console.log('TRI-PAGE-ERR: ' + (e && e.message) + ' @ ' + (e && e.filename) + ':' + (e && e.lineno) +
                  '\n' + String((e && e.error && e.error.stack) || '').slice(0, 700));
    } catch (x) {}
  });
  window.addEventListener('unhandledrejection', function (e) {
    try {
      var r = e && e.reason;
      console.log('TRI-REJ-ERR: ' + String((r && (r.stack || r.message)) || r).slice(0, 700));
    } catch (x) {}
  });
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  var listEl = document.getElementById('list');
  function render() {
    listEl.innerHTML = results.map(function (r) {
      return '<li class="' + (r.state === 'run' ? 'run' : (r.ok ? 'ok' : 'bad')) + '">' +
        '<span class="nm">' + r.name + '</span><span class="dt">' + r.detail + '</span></li>';
    }).join('');
  }

  function poll(fn, ms, timeout, what) {
    var t0 = Date.now();
    return (function again() {
      return Promise.resolve().then(fn).then(function (v) {
        if (v) return v;
        if (Date.now() - t0 > timeout) throw new Error(what + ' timeout (' + Math.round(timeout / 1000) + 's)');
        return sleep(ms).then(again);
      });
    })();
  }

  /* ── iframe (= asli app) helpers ─────────────────────────────────────── */
  var frame = document.getElementById('appFrame');
  function W() { return frame.contentWindow; }
  function D() { return frame.contentDocument; }

  function bootApp() {
    return new Promise(function (resolve) {
      frame.onload = function () { resolve(); };
      frame.src = 'index.html?tri-e2e=' + RUN + '&v=' + Date.now();
    });
  }

  var STEPS = [
    /* ── 1/8 : app iframe + ASLI login (app ke apne auth se) ──
       Note: app ka Firebase named app "mainApp" hai (Auth persistence LOCAL
       = IndexedDB key me app-name bhi hota hai). Isliye login HAMESHA app ke
       apne auth object se hota hai — warna session us app ko dikhta hi nahi. */
    ['1/18 app iframe + QA player login (asli app auth)', function () {
      if (!EMAIL || !PASS) fail('creds', 'email/password URL fragment me nahi mile');
      return bootApp().then(function () {
        return poll(function () { try { return W() && W().auth ? W() : null; } catch (e) { return null; } },
          1000, 120000, 'app ka firebase auth load');
      }).then(function (w) {
        w.eval('window.__triSignIn=null; window.auth.signInWithEmailAndPassword(' +
               JSON.stringify(EMAIL) + ',' + JSON.stringify(PASS) + ')' +
               '.then(function(){window.__triSignIn="ok";})' +
               '.catch(function(e){window.__triSignIn="err:"+((e&&e.code)||(e&&e.message)||"unknown");});');
        return poll(function () { return W().__triSignIn; }, 1000, 90000, 'firebase sign-in')
          .then(function (st) {
            if (st !== 'ok') fail('sign-in', st);
            return 'app ke apne auth se login (app-name mainApp, wahi persistence)';
          });
      });
    }],

    /* ── 2/8 : app auto-login + login screen hatna ── */
    ['2/18 asli app login (onAuthStateChanged → _handleSignIn)', function () {
      return poll(function () {
        try {
          var w = W();
          return (w && w.U && w.U.uid && w.UD && w._supa) ? w : null;
        } catch (e) { return null; }
      }, 1000, 120000, 'app login (U/UD/_supa)').then(function (w) {
        VALUES.uid = w.U.uid;
        /* 🛡️ (2026-10-13h) State Verification gate (legal-compliance.js) —
           QA account par DB me state='Haryana' set hai, par agar kisi wajah se
           gate khul jaye to asli UI wale raaste se (mesStateOk) clear karo,
           warna baaki saare modals uske peeche block ho jaate hain. */
        try {
          w.eval("if (window.UD && !window.UD.state && typeof window.mesStateOk === 'function') { window.mesStateOk('Haryana'); }");
        } catch (e) {}
        /* ⚠️ Supabase client ko Firebase token milna ASYNC hai (db.js
           syncFirebaseToken). Us se pehle koi bhi write RLS se reject hoti hai
           (policy: auth.jwt()->>'sub' = user_id) — CI me exactly yahi hua:
           ticket insert token se pehle chala gaya aur DB me kuch nahi aaya.
           Isliye ab token sync ka explicit intezaar. */
        return poll(function () { return (w._supaTokenUid === w.U.uid) ? true : null; },
          1000, 120000, 'supabase token sync (_supaTokenUid)').then(function () {
        return poll(function () {
          var ls = w.document.getElementById('loginScreen');
          return (ls && getComputedStyle(ls).display === 'none') ? true : null;
        }, 800, 90000, 'login screen hatna').then(function () {
          return 'uid ' + String(VALUES.uid).slice(0, 8) + '… — login screen gaya, UD + _supa ready + token sync';
        });
        });
      });
    }],

    /* ── 3/N : APK → Admin (support ticket) ── */
    ['3/18 APK → Admin: support ticket submit', function () {
      var w = W();
      w.eval("if (window.showSupportForm) showSupportForm();");
      return poll(function () { return w.document.getElementById('supMsg'); }, 800, 40000, 'support form')
        .then(function () {
          w.document.getElementById('supType').value = 'other';
          w.document.getElementById('supMsg').value = MARK + ' — APK se bheja gaya ticket (tri-e2e)';
          /* Ticket insert ke 3 koshish (app ke andar bhi 3 retry hain; yahan
             dobara submit karte hain agar pehla attempt RLS/token race me
             reh gaya ho). Har attempt ke baad DB check — aur error bhi pakdo. */
          var tries = 0;
          function _one() {
            tries++;
            w.eval('window.submitSupportTicket()');
            return poll(function () {
              return w._supa.from('support_tickets').select('id,message')
                .eq('user_id', w.U.uid).like('message', '%' + MARK + '%')
                .then(function (r) { return (r.data && r.data.length) ? r.data[0] : null; });
            }, 2500, tries < 3 ? 25000 : 60000, 'ticket DB me (koshish ' + tries + ')').catch(function (e) {
              if (tries >= 3) throw e;
              return _one();
            });
          }
          return _one();
        })
        .then(function (row) { VALUES.ticket_row = row.id; return 'ticket #' + row.id.slice(0, 8) + ' DB me (admin panel isi ko dekhega)'; });
    }],

    /* ── 4/N : Admin → APK (ticket reply, asli My-Tickets modal) ── */
    ['4/18 Admin → APK: ticket reply dikhe (My Tickets)', function () {
      var w = W();
      return poll(function () {
        return w._supa.from('support_tickets').select('admin_reply,status')
          .eq('id', VALUES.ticket_row).maybeSingle()
          .then(function (r) { return (r.data && r.data.admin_reply) ? r.data.admin_reply : null; });
      }, 4000, 420000, 'admin reply (host driver se)')
        .then(function (reply) {
          VALUES.ticket_reply = reply;
          /* Modal ek hi baar render hota hai — isliye har koshish me modal
             dobara kholte hain aur POORE page text me reply dhoondhte hain
             (container badal jaye to bhi pakda jaye). */
          return poll(function () {
            var w2 = W();
            if (w2.closeModal) w2.eval("if (window.closeModal) closeModal();");
            w2.eval("if (window.showMyTickets) showMyTickets();");
            return new Promise(function (res) {
              setTimeout(function () {
                var body = (w2.document.body && w2.document.body.innerText) || '';
                res(body.indexOf(reply.slice(0, 30)) >= 0 ? true : null);
              }, 2500);
            });
          }, 1000, 90000, 'reply modal me');
        })
        .then(function () { return 'reply APK ke My-Tickets modal me dikh gaya: “' + String(VALUES.ticket_reply).slice(0, 34) + '…”'; });
    }],

    /* ── 5/N : Admin → APK (SD credit, asli wallet UI) ── */
    ['5/18 Admin → APK: coins credit (wallet UI)', function () {
      var w = W();
      return poll(function () {
        return w._supa.from('users').select('coins,sky_diamonds').eq('id', w.U.uid).maybeSingle()
          .then(function (r) { return (r.data && Number(r.data.coins) > 0) ? r.data : null; });
      }, 4000, 420000, 'admin ka coins credit (host driver se)')
        .then(function (u) {
          VALUES.coins = String(u.coins);
          VALUES.sky_diamonds = String(u.sky_diamonds);
          w.eval("if (window.navTo) navTo('wallet');");
          return poll(function () {
            var w2 = W(), ui = w2.document.getElementById('wCoins');
            var fromUD = w2.UD && String(w2.UD.coins);
            if (ui && String(ui.textContent).replace(/[^0-9]/g, '') === String(VALUES.coins)) { VALUES.wallet_coins_ui = String(ui.textContent).trim(); return true; }
            if (fromUD === String(VALUES.coins) && ui) { VALUES.wallet_coins_ui = String(ui.textContent).trim(); return true; }
            return null;
          }, 1500, 90000, 'wallet UI par coins');
        })
        .then(function () { return 'wallet par 🪙' + VALUES.coins + ' (UI: ' + (VALUES.wallet_coins_ui || '') + ') — admin_set_coins server credit APK tak pahuncha'; });
    }],

    /* ── 6/N : Admin → APK (match) ── */
    ['6/18 Admin → APK: naya match list me', function () {
      var w = W();
      return poll(function () {
        /* ⚠️ 2026-10-16: host ka room-match ka title "… — Room" par khatam hota
           hai (main match "… — Custom Room" par). Is liye yahan sirf "— Room"
           par khatam hone wali row chhodi jati hai — "Room" shabd par filter
           KABHI nahi (main title me bhi Room hai!). */
        return w._supa.from('matches').select('title').ilike('title', MARK + '%')
          .order('created_at', { ascending: false }).limit(10)
          .then(function (r) {
            var rows = (r && r.data) || [];
            var i, t, fallback = null;
            for (i = 0; i < rows.length; i++) {
              t = String(rows[i].title || '');
              if (t.slice(-13) === '— Custom Room') return t;   /* asli main match */
              if (t.slice(-6) !== '— Room' && !fallback) fallback = t;
            }
            return fallback;
          });
      }, 4000, 420000, 'admin ka match (host driver se)')
        .then(function (title) {
          VALUES.match_title = title;
          function _nudge() {
            w.eval("try{ if (window.navTo) navTo('home'); }catch(e){}" +
                   "try{ if (window.renderHome) renderHome(); }catch(e){}" +
                   "try{ if (window._loadMatches) _loadMatches(); }catch(e){}" +
                   "try{ if (window.refreshMatches) refreshMatches(); }catch(e){}");
          }
          function _seen() {
            var w2 = W();
            var inModel = false;
            try {
              var arr = w2.MATCHES || w2._matches || [];
              inModel = (Array.isArray(arr) ? arr : Object.values(arr)).some(function (m) {
                return ((m && (m.title || m.name)) || '') === title; });
            } catch (e) {}
            if (!inModel) { try { var mt = w2.MT || {}; inModel = Object.keys(mt).some(function (k) { return (mt[k] && mt[k].title) === title; }); } catch (e) {} }
            var body = (w2.document.body && w2.document.body.innerText) || '';
            return (inModel || body.indexOf(title) >= 0) ? true : null;
          }
          _nudge();
          return poll(function () { _nudge(); return _seen(); }, 3000, 120000, 'match app me render')
            .catch(function () {
              /* App ka data-layer refresh kabhi UI tak nahi pahunchta (screen
                 already rendered). Tab asli user ki tarah: page reload —
                 session persistence LOCAL hai, isliye login nahi tootega. */
              return bootApp().then(function () {
                return poll(function () { try { return W()._supa ? true : null; } catch (e) { return null; } }, 1000, 60000, 'app dobara load');
              }).then(function () {
                return poll(function () {
                  var w2 = W();
                  try { if (w2._loadMatches) w2.eval('_loadMatches()'); } catch (e) {}
                  return _seen();
                }, 3000, 150000, 'match app me render (reload ke baad)');
              });
            });
        })
        .then(function () { return 'match APK me dikha: “' + String(VALUES.match_title).slice(0, 40) + '”'; });
    }],

    /* ── 7/N : Admin → APK (notification) ── */
    ['7/18 Admin → APK: notification', function () {
      var w = W();
      return poll(function () {
        return w._supa.from('notifications').select('title,body').eq('user_id', w.U.uid)
          .like('title', MARK + '%').order('created_at', { ascending: false }).limit(1)
          .then(function (r) { return (r.data && r.data[0]) ? r.data[0] : null; });
      }, 4000, 420000, 'admin notification (host driver se)')
        .then(function (n) {
          VALUES.notif_title = n.title;
          w.eval("if (window._loadNotifs) _loadNotifs(); if (window.renderNotifications) renderNotifications();");
          return poll(function () {
            var w2 = W();
            var arr = w2.NOTIFS || [];
            var hit = Array.isArray(arr) ? arr.some(function (x) { return (x.title || '') === n.title; })
                                         : Object.values(arr).some(function (x) { return (x.title || '') === n.title; });
            return (hit || w2.document.body.innerText.indexOf(n.title) >= 0) ? true : null;
          }, 2500, 120000, 'notification app me');
        })
        .then(function () { return 'notification APK me: “' + String(VALUES.notif_title).slice(0, 34) + '”'; });
    }],

    /* ── 8/N : Admin → APK (KYC approve, asli modal) ── */
    ['8/18 Admin → APK: KYC approved dikhe', function () {
      var w = W();
      return poll(function () {
        return w._supa.from('kyc_requests').select('status').eq('user_id', w.U.uid)
          .order('created_at', { ascending: false }).limit(1)
          .then(function (r) { return (r.data && r.data[0] && /approved|verified/.test(r.data[0].status)) ? r.data[0].status : null; });
      }, 4000, 420000, 'admin KYC approve (host driver se)')
        .then(function (st) {
          VALUES.kyc_status = st;
          w.eval("if (window.closeModal) closeModal(); if (window.mesShowKYC) mesShowKYC();");
          return poll(function () {
            var body = W().document.body.innerText || '';
            return (body.indexOf('KYC Verified') >= 0 || body.indexOf('verify ho chuki') >= 0) ? true : null;
          }, 1800, 90000, 'KYC Verified app me');
        })
        .then(function () { return 'KYC verified APK me dikh gaya (DB status=' + VALUES.kyc_status + ')'; });
    }]
  ];

  /* ── runner ──────────────────────────────────────────────────────────── */
  /* ── 9/18 : APK (P1) match join — ASLI UI raasta.
     ✅ 2026-10-14/16 (live TRI 38574154924 + 38881149079 me step 9 fail):
       • doJoin/cJoin `MT[id]` dekh kar chalte hain — app ke data-layer me
         match na ho to wo CHUP-CHAAP return karte hain (koi error nahi).
         Is liye pehle asli `_loadMatches()` (+ zaroorat par asli page reload).
       • join pehle ASLI UI se: matches screen → card ka Join (cJoin) →
         asli "Confirm Join" button (#confirmJoinBtn) → app ka confirm aaye
         to asli "Haan, karo" (#_appDlgOk).
       • agar ek koshish me row na bane (emulator me ek request hang ho jati
         hai — logcat me 'Connection reset by peer' bhi dikha), to har 30s
         par koshish dohrai jaati hai: pehle UI, phir WAHI server wala RPC
         (validate_and_join_match — asli join ka server authority). Har
         koshish ka nateeja alag se log hota hai (TRI-JOIN-RPC / TRI-JOIN-A).
       • Fail par saaf diag logcat me: toast, dialog, MT me match, MT count,
         security wrapper laga hai ya nahi, token uid, aur DB se match status. */
  STEPS.push(['9/18 APK → match join (asli doJoin)', function () {
    var w = W();
    var JOIN_ATTEMPTS = 6, ATTEMPT_MS = 30000;
    function _mtReady(id) {
      try { if (w.eval) w.eval("if (window._loadMatches) _loadMatches();"); } catch (e) {}
      try { return (w.MT && w.MT[id]) ? true : null; } catch (e) { return null; }
    }
    function _fireRpc(id) {
      try {
        W().eval('(function(){ var p = window._supa.rpc("validate_and_join_match", {p_uid: window.U.uid, p_match_id: ' + JSON.stringify(id) +
          ', p_entry_fee: 0, p_currency: "coins", p_join_data: {mode: "solo", ign: (window.UD && window.UD.ign) || ""}});' +
          'var done = false; p.then(function(r){ done = true; console.log("TRI-JOIN-RPC: " + JSON.stringify((r && r.error && (r.error.message || r.error.code)) || (r && r.data))); },' +
          'function(e){ done = true; console.log("TRI-JOIN-RPC-ERR: " + String(e && (e.message || e)).slice(0,160)); });' +
          'setTimeout(function(){ if (!done) console.log("TRI-JOIN-RPC: PENDING(12s)"); }, 12000); })();');
        return true;
      } catch (e) { console.log('TRI-JOIN-A: rpc eval fail ' + String(e).slice(0, 90)); return false; }
    }
    /* ── network probe (2026-10-16): TRI 38886753522 me join ke 6 koshish
       (UI 35s + RPC 31s) sab chup-chaap fail hui aur RPC ka koi jawab hi
       log nahi hua. Server side pakka theek hai (role par statement_timeout
       8s hai — jawab 8s me aana hi tha). Is liye yahan ek chhota saaf
       experiment: (A) GET, (B) POST insert (wahi jo step 3 me pass hua tha),
       (C) rpc jo maujood nahi hai (404/error bhi saboot = round trip hua),
       (D) raw fetch POST — aur Resource Timing se dekho request gayi thi ya
       nahi (responseStart 0 = jawab hi nahi aaya). ── */
    function _race(p, ms, tag) {
      return Promise.race([
        Promise.resolve(p).then(function (r) {
          var t = r && r.error ? ('ERR: ' + (r.error.message || r.error.code)) : 'OK';
          if (r && r.data !== undefined && r.data !== null && r.error === null) {
            try { t = 'OK ' + JSON.stringify(r.data).slice(0, 60); } catch (e) {}
          }
          return tag + ' → ' + t;
        }, function (e) { return tag + ' → THROW ' + String(e && (e.message || e)).slice(0, 90); }),

      return bootApp().then(function () {
        return poll(function () { try { return W().U && W().U.uid ? true : null; } catch (e) { return null; } }, 1500, 90000, 'reload ke baad login (persistence)');
      }).then(function () {
        return poll(function () {
          return _hit().then(function (b2) { return (b2.medal && b2.medal.indexOf('ranks/gold.png') !== -1) ? b2 : null; });
        }, 4000, 120000, 'APK par equipped ring ka medal');
      });
    }).then(function (b) {
      VALUES.cosmetic_ring = 'frame_ring_gold';
      VALUES.ring_medal = 'profile-medal';
      if (!b.owned) fail('ring_owned', 'UD.cosmetics me ring nahi (owned nahi hua)');
      /* store tile bhi asli art dikhata hai? */
      try {
        W().eval("if (window.showCosmeticsStore) showCosmeticsStore();");
      } catch (e) {}
      return new Promise(function (res) { setTimeout(function () { res(_state()); }, 2500); });
    }).then(function (b2) {
      if (!b2.tiles) fail('ring_tiles', 'store/profile me rings ka art (img[src*=img/ranks/]) kahin nahi mila');
      return 'APK par equipped ring ka medal dikha (' + (b2.alt || 'ring') + ', art=' + (b2.medal.split('/').pop() || '') + ') + ' + b2.tiles + ' ring art tiles store me — wahi ring jo web par kharida tha';
    });
  }]);

  /* ── 14/14 : Phase-3 — Room ID/password (creator ne web par set kiya,
     APK me wahi dikha). Host ne H9b me: match ka creator = P1 (admin write),
     P1 ne app ki creator-room UI se room ID save kiya (creator_set_room),
     admin ne release kiya. Ab APK (wahi P1 account) par wahi Room ID dikhna
     chahiye — asli RPC get_room_credentials + asli UI. */
  STEPS.push(['14/18 Room ID/password — web par set, APK par dikha (Phase-3)', function () {
    var roomId = 'TRIROOM' + String(RUN).slice(0, 6).toUpperCase();
    function _scan() {
      try {
        var w = W();
        var txt = (w.document.body && w.document.body.innerText) || '';
        return txt.indexOf(roomId) !== -1 ? { where: 'apk-ui-room-box' } : null;
      } catch (e) { return null; }
    }
    function _openRoom() {
      try {
        var w = W();
        w.eval("if (window.navTo) navTo('matches'); if (window._loadMatches) _loadMatches();");
      } catch (e) {}
      return new Promise(function (res) { setTimeout(res, 2500); }).then(function () {
        /* ✅ 2026-10-16 diag: pehle run me is step ka koi log nahi tha, is liye
           yahan har kadam console par — rid mila ya nahi, MT me hai ya nahi,
           aur asli RPC (get_room_credentials) ka poora jawab. */
        return W()._supa.from('matches').select('id,title').ilike('title', MARK + '%— Room').limit(1)
          .then(function (r) {
            var rid = (r && r.data && r.data[0]) ? r.data[0].id : '';
            console.log('TRI-ROOM: rid=' + rid + ' row=' + JSON.stringify((r && r.data) || null).slice(0, 140) +
                        ' err=' + ((r && r.error && r.error.message) || '-'));
            if (!rid) return null;
            return W()._supa.rpc('get_room_credentials', { p_match_id: rid }).then(function (res) {
              console.log('TRI-ROOM: rpc=' + JSON.stringify(res && res.data).slice(0, 180));
              try { W().eval("if (window._loadMatches) _loadMatches();"); } catch (e) {}
              return new Promise(function (r2) { setTimeout(r2, 2000); }).then(function () {
                var inMt = false;
                try { inMt = !!(W().MT && W().MT[rid]); } catch (e) {}
                console.log('TRI-ROOM: inMT=' + inMt + ' mtKeys=' + (function () {
                  try { return Object.keys(W().MT || {}).length; } catch (e) { return 'na'; } })());
                try { W().eval("if (window._showRoomViaRpc) _showRoomViaRpc('" + rid + "');"); } catch (e) {}
                return new Promise(function (r3) { setTimeout(r3, 2500); });
              });
            });
          })['catch'](function (e) { console.log('TRI-ROOM: diag fail ' + String(e).slice(0, 120)); });
      }).then(function () {
        /* ✅ 2026-10-16: Room test ab ALAG match par hota hai (host H9b
           '…— Room' naam ka naya match banata hai) — pehle wahi main match
           tha jisme P1 ko join karna hota hai, aur uska creator_uid set karne
           se server P1 ka join rok deta tha (SELF_PLAY_BLOCKED). Is liye pehle
           DB se us room-match ka id nikaalo, phir wahi kholo. */
        try {
          W()._supa.from('matches').select('id').ilike('title', MARK + '%— Room').limit(1)
            .then(function (r) {
              var rid = (r && r.data && r.data[0]) ? r.data[0].id : (VALUES.match_id || '');
              try { W().eval("if (window._showRoomViaRpc) _showRoomViaRpc('" + rid + "');"); } catch (e) {}
            });
        } catch (e) {
          try { W().eval("if (window._showRoomViaRpc) _showRoomViaRpc('" + (VALUES.match_id || '') + "');"); } catch (e) {}
        }
        return new Promise(function (res) { setTimeout(res, 2500); });
      }).then(function () { return _scan(); });
    }
    return _openRoom().then(function (hit) {
      if (hit) return hit;
      /* UD/MT stale ho sakta hai — ek asli reload */
      return bootApp().then(function () {
        return poll(function () { try { return W().U && W().U.uid ? true : null; } catch (e) { return null; } }, 1500, 90000, 'reload ke baad login (persistence)');
      }).then(function () {
        return poll(function () { return _openRoom(); }, 5000, 150000, 'APK par Room ID box');
      });
    }).then(function (hit) {
      VALUES.room_id = roomId;
      if (!hit) fail('room_id', 'APK ki UI par Room ID nahi mila: ' + roomId);
      return 'APK par Room ID box dikha — "' + roomId + '" (creator ne web par set kiya tha, admin ne release kiya; asli get_room_credentials RPC se)';
    });
  }]);

  /* ── 15/15 : Phase-3 DUO team — captain ne (web par) app ke asli join UI se
     partner invite kiya, partner ne apni notification ke asli Accept se consent
     diya, phir team join server (join_match_team) par pass hua. APK (wahi
     captain account) par wahi duo match ab 2 players ke saath dikhna chahiye. ── */
  STEPS.push(['15/18 Duo team — invite → accept → 2 players (APK)', function () {
    var duoTitle = 'QA-TEST TRI ' + RUN + ' — Duo';
    function _check() {
      try {
        var w = W();
        var MT = w.MT || {};
        var hit = null;
        Object.keys(MT).forEach(function (k) {
          var t = MT[k] || {};
          var nm = String(t.name || t.title || '');
          if (nm.indexOf(duoTitle) !== -1) {
            hit = { id: k, filled: Number(t.filledSlots || t.joinedSlots || 0), nm: nm };
          }
        });
        return (hit && hit.filled >= 2) ? hit : null;
      } catch (e) { return null; }
    }
    try { W().eval("if (window.navTo) navTo('matches'); if (window._loadMatches) _loadMatches();"); } catch (e) {}
    return poll(function () {
      try { W().eval("if (window._loadMatches) _loadMatches();"); } catch (e) {}
      return _check();
    }, 6000, 240000, 'APK par duo match me 2 players').then(function (hit) {
      VALUES.duo_title = duoTitle;
      VALUES.duo_players = String(hit.filled);
      return 'APK par duo match "' + duoTitle + '" me ' + hit.filled + ' players — captain ka invite + partner ka accept dono server par pass, team join live';
    });
  }]);

  /* ── 16/16 : 3.6 check-in streak — web par (captain account) asli check-in hui,
     ab APK par wahi streak strip (asli users.streak_days se) dikhna chahiye. ── */
  STEPS.push(['16/18 Check-in streak strip (APK par wahi streak)', function () {
    function _strip() {
      try {
        var w = W();
        var d = w.document;
        var el = d.getElementById('loginStreakStrip');
        if (!el) return null;
        return {
          streak: Number(el.getAttribute('data-streak') || 0),
          cycle: el.getAttribute('data-cycle'),
          warrior: !!(el.querySelector ? el.querySelector('img[src*="week-warrior.png"]') : null),
          txt: (el.innerText || '').replace(/\n/g, ' ').slice(0, 60)
        };
      } catch (e) { return null; }
    }
    try { W().eval("if (window.navTo) navTo('home'); if (window.renderHome) renderHome();"); } catch (e) {}
    return poll(function () {
      try { W().eval("if (window.renderHome) renderHome();"); } catch (e) {}
      var s = _strip();
      return (s && s.streak >= 1) ? s : null;
    }, 6000, 240000, 'APK home par streak strip (streak >= 1)').then(function (s) {
      if (!s.warrior) fail('streak_warrior', 'APK strip me Week Warrior kala nahi mili');
      VALUES.streak_days = String(s.streak);
      VALUES.streak_strip = 'home-strip';
      return 'APK home par check-in streak strip — ' + s.streak + '/7 din (Week Warrior kala ✔) · ' + s.txt;
    });
  }]);

  /* ── 17/17 : 3.8/11 Season Champion ka bada ailaan — host driver ne asli
     season_champions row daali hogi (P1 ka), APK home par wahi 3-din wala
     banner + asli kala dikhni chahiye (client dono surfaces par ek jaisa). ── */
  STEPS.push(['17/18 Season Champion bada ailaan (APK par)', function () {
    function _champ() {
      try {
        var w = W(), el = w.document.getElementById('seasonChampionBanner');
        var inner = el && el.querySelector ? (el.querySelector('#seasonChampionBanner') || el) : el;
        if (!inner || inner.getAttribute('data-mine') !== '1') return null;
        var t = (inner.innerText || '');
        return {
          mine: inner.getAttribute('data-mine'),
          txt: t.replace(/\n/g, ' ').slice(0, 70),
          kala: !!(w.ASSET_CATALOG && w._assetUnlocked && w._assetStats &&
                   w._assetUnlocked(w.ASSET_CATALOG.special.find(function (x) { return x.id === 'sp_season_champion'; }), w._assetStats()))
        };
      } catch (e) { return null; }
    }
    try { W().eval("if (window.navTo) navTo('home'); if (window.renderHome) renderHome();"); } catch (e) {}
    return poll(function () {
      try { W().eval("if (window.renderHome) renderHome(); if (window.refreshSeasonChampion) refreshSeasonChampion();"); } catch (e) {}
      return _champ();
    }, 6000, 420000, 'APK home par champion banner (apna)').then(function (b) {
      if (!b.kala) fail('champion_kala', 'APK par Season Champion kala unlock nahi hui');
      VALUES.champion_banner = 'ok';
      return 'APK home par bada ailaan — "' + b.txt + '" (Season Champion kala ✔)';
    });
  }]);

  /* ── 18/18 : 3.9 badge unlock push — host driver ne asli users row ke stats
     badha kar asli notifyNewBadges chalaya; APK (wahi account) ko wo asli
     notification row apni list me dikhni chahiye (isi row par push trigger
     lagi hui hai — 200 push gateway alag se live-proved hai). ── */
  STEPS.push(['18/18 Badge unlock push (APK par asli row)', function () {
    function _bn() {
      try {
        var w = W();
        return w._supa.from('notifications')
          .select('type,title,ref_id').eq('user_id', w.U.uid)
          .in('type', ['badge_unlock', 'badge_near_unlock']).limit(3);
      } catch (e) { return null; }
    }
    return poll(function () {
      var q = _bn();
      if (!q) return null;
      return q.then(function (r) {
        var rows = (r && r.data) || [];
        if (!rows.length) return null;
        /* ⚠️ 2026-10-16: same render par 'bas thoda sa aur' (near-unlock) row bhi
           ban sakti hai — is liye sirf pehli row par na rukо, ASLI unlock row
           dhoondo (title "🏅 Naya badge: …" / "✨ Naya title: …"). */
        var un = rows.filter(function (x) {
          var t = String(x.title || '');
          return t.indexOf('Naya badge') !== -1 || t.indexOf('Naya title') !== -1;
        });
        if (un.length) return { n: rows.length, t: String(un[0].title || ''), ty: un[0].type, ok: true };
        return { n: rows.length, t: String(rows[0].title || ''), ty: rows[0].type, ok: false };
      }, function () { return null; });
    }, 6000, 420000, 'APK par badge unlock notification row (asli)').then(function (b) {
      if (!b.ok) {
        fail('badge_unlock_title', 'unlock row nahi mili — rows=' + b.n + ', sabse nayi: ' + b.t.slice(0, 60));
      }
      VALUES.badge_unlock_push = 'ok';
      return 'APK par badge unlock notification (' + b.ty + ' × ' + b.n + ') — "' + b.t.slice(0, 48) + '"';
    });
  }]);

  function markState(i, state, detail) {
    results[i] = results[i] || { name: STEPS[i][0], detail: '' };
    results[i].state = state;
    if (detail) results[i].detail = detail;
    render();
  }

  (async function run() {
    console.log('TRI-E2E-START: run=' + RUN + ' steps=' + STEPS.length);
    for (var i = 0; i < STEPS.length; i++) {
      var nm = STEPS[i][0];
      markState(i, 'run', 'chal raha hai…');
      var t0 = Date.now();
      try {
        var detail = await STEPS[i][1]();
        results[i] = { name: nm, ok: true, detail: detail || 'ok', secs: Math.round((Date.now() - t0) / 1000) };
        logStep(nm, (detail || 'ok') + ' [' + results[i].secs + 's]', true);
      } catch (e) {
        results[i] = { name: nm, ok: false, detail: (e && e.message || String(e)).slice(0, 220), secs: Math.round((Date.now() - t0) / 1000) };
        logStep(nm, 'FAIL: ' + results[i].detail, false);
      }
      render();
    }
    var ok = results.filter(function (r) { return r.ok; }).length;
    var el = document.getElementById('result');
    el.className = 'big' + (ok === STEPS.length ? '' : ' fail');
    el.textContent = 'TRI-E2E-RESULT: ' + ok + '/' + STEPS.length + ' OK';
    console.log('TRI-E2E-RESULT: ' + ok + '/' + STEPS.length + ' OK');
    console.log('TRI-E2E-VALUES: ' + JSON.stringify(VALUES));
    document.getElementById('values').textContent = 'TRI-E2E-VALUES: ' + JSON.stringify(VALUES);
  })();
})();
</script>
</body>
</html>
