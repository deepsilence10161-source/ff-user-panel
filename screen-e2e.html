<script>
/* ================================================================
   SCREEN E2E (2026-10-12) — asli app pages ke bina bhi, har us screen
   ka render jo user-attraction ke liye joda gaya, LIVE chala kar
   verify karta hai. Emulator/CI me MainActivity ke intent se load
   hota hai (github.io + /screen-e2e.html) aur result console.error
   par deta hai:  logcat me "SCREEN-E2E-RESULT: ..." milta hai.

   Niyam: koi jaali (mock) function nahi — jo app me load hota hai
   bilkul wahi file chalayi jaati hai (asset-catalog + badge-engine).
   Har check ka proof: HTML me asli <img src> aur progress text.
   ================================================================ */
(function () {
  var PASS = 0, FAIL = 0, fails = [], lines = [];
  var DONE = false, LASTSTEP = 'script start';
  /* 8d → 9b sequencing (dekho 9b ka note — race fix) */
  var _p8dResolve = null, _p8d = new Promise(function (res) { _p8dResolve = res; });
  /* ⚠️ 2026-10-13d: 9d (rank ribbon) 9b ke POORE hone par chale — 9b apna
     UD/_supa stub async card-render ke beech me rakhta hai; agar 9d usse
     pehle globals badal de to 9b ka card apna title chip kho deta hai
     (yahi bug pakda gaya: title chip gayab, clan chip bacha reh gaya). */
  var _p9bResolve = null, _p9b = new Promise(function (res) { _p9bResolve = res; });

  /* ✅ HARDENING (2026-10-12): CI emulator me pichhli baar ye page load
     hote hue bhi RESULT marker 120s me nahi aaya (root cause tab tak
     saaf nahi tha). Ab har step ka heartbeat logcat me jata hai
     (SCREEN-E2E-STEP), aur ek watchdog (60s) + window.onerror +
     unhandledrejection = marker HAR HAAL me aayega. Koi check hataayi
     NAHI gayi — sirf guarantee ki fail ho to saaf reason ke saath fail
     ho, aur atke to "watchdog: atka — <step>" likh kar fail ho. */
  function beat(msg) {
    LASTSTEP = msg;
    try { console.error('SCREEN-E2E-STEP: ' + msg); } catch (e) {}
  }
  try { console.error('SCREEN-E2E-BOOT: started'); } catch (e) {}
  try {
    window.addEventListener('error', function (ev) {
      beat('window error: ' + (ev && ev.message ? ev.message : 'unknown'));
    });
    window.addEventListener('unhandledrejection', function (ev) {
      var r = ev && ev.reason;
      beat('promise reject: ' + (r && r.message ? r.message : String(r)));
    });
  } catch (e) {}
  if (typeof setTimeout === 'function') {
    setTimeout(function () {
      if (!DONE) {
        FAIL++;
        fails.push('watchdog 60s — is step par atka: ' + LASTSTEP);
        finish('watchdog');
      }
    }, 60000);
  }

  function ok(cond, label, extra) {
    if (cond) { PASS++; lines.push('<div class="card ok">✓ ' + label + (extra ? ' <code>' + extra + '</code>' : '') + '</div>'); }
    else { FAIL++; fails.push(label); lines.push('<div class="card fail">✗ ' + label + (extra ? ' <code>' + extra + '</code>' : '') + '</div>'); }
  }
  function out() {
    document.getElementById('log').innerHTML = lines.join('');
  }

  /* ── Test stats: jaan-boojh kar aise numbers jo kai badges kholte hain,
       aur ek badge (Apex = 5000 RP) bilkul kareeb rakhte hain — taa ke
       "agla inaam" wala near-miss logic bhi asli me exercise ho ── */
  var ST = { wins: 60, kills: 160, matches: 40, streak: 5, loginStreak: 7,
             rp: 4900, level: 26, clean: 101, premium: 1,
             top1: 2, top3: 16, top5: 26, top10: 51, soloWins: 26, comebacks: 6 };

  beat('1/12 engine load');
  /* ── 1. engine load ── */
  ok(!!window.ASSET_CATALOG, 'asset-catalog load hua', window._assetAll ? window._assetAll().length + ' items' : '');
  ok(!!window.__BADGE_ENGINE, 'badge-engine load hua', window.__BADGE_ENGINE ? 'v' + window.__BADGE_ENGINE.version : '');

  beat('2/12 rank badges');
  /* ── 2. rank badge image (har tier ka) ── */
  var rankCases = [[0,'bronze'],[301,'silver'],[601,'gold'],[1001,'platinum'],[1501,'diamond'],[2001,'legend']];
  var rankOk = rankCases.every(function (c) {
    var p = window.rankBadgeImg(c[0]);
    return p && p.indexOf('/ranks/' + c[1] + '.png') !== -1;
  });
  ok(rankOk, 'rankBadgeImg — 6/6 tier sahi image', rankCases.map(function (c) { return c[1]; }).join(','));

  beat('3/12 earned badges');
  /* ── 3. kamaye hue badges ── */
  var earned = window.getEarnedBadges(ST);
  ok(earned.length >= 8, 'getEarnedBadges — kamaye badges mile', earned.length + ' badges');
  ok(earned.every(function (b) { return b.img && b.img.indexOf('assets/img/') === 0; }), 'har kamaye badge ki asli image maujood');

  beat('4/12 top badges');
  /* ── 4. top badges (share-card ke liye) ── */
  var top = window.getTopBadges(ST, 4);
  ok(top.length === Math.min(4, earned.length), 'getTopBadges — sabse durlabh pehle', top.map(function (t) { return t.name; }).join(' > '));

  beat('5/12 agla inaam');
  /* ── 5. agla inaam (near-miss) ── */
  var nr = window.getNextReward(ST);
  ok(!!nr && nr.pct > 0 && nr.pct < 100, 'getNextReward — sabse kareeb locked inaam + %', nr ? nr.name + ' ' + nr.have + '/' + nr.need + ' (' + nr.pct + '%)' : 'null');
  ok(!!nr && nr.need > nr.have, 'agla inaam abhi baaki hai (100% se kam)', nr ? 'baaki: ' + (nr.need - nr.have) : '');

  beat('6/12 HOME strip');
  /* ── 6. HOME strip ── */
  var strip = window.renderNextRewardStrip(ST);
  ok(strip.length > 80 && strip.indexOf('<img') !== -1 && strip.indexOf('%') !== -1, 'HOME strip HTML — image + progress bar', strip.length + ' chars');

  beat('7/12 PROFILE row');
  /* ── 7. PROFILE badge row ── */
  var show = window.renderBadgeShowcaseRow(ST);
  ok(show.length > 60 && show.indexOf('<img') !== -1, 'PROFILE badge showcase — images', show.length + ' chars');
  var showEmpty = window.renderBadgeShowcaseRow({});
  ok(showEmpty === '' || showEmpty.indexOf('Pehla badge') !== -1, '0 badge par khali nahi — pehla-badge hint');

  beat('8/12 premium ribbon');
  /* ── 8. premium ribbon ── */
  window.getUserPremiumTier = undefined; window.UD = { premium_level: 0 };
  var r0 = window.premiumRibbonHtml(20);
  ok(r0 === '', 'premium ribbon — non-premium par KUCH NAHI (jhoota dava nahi)');
  window.UD = { premium_level: 1 };
  var r1 = window.premiumRibbonHtml(20);
  ok(r1.indexOf('premium/ribbon.png') !== -1, 'premium ribbon — premium par sunehra ribbon image');

  /* ── 8b. DOOSRE player ka ribbon (leaderboard) — premiumRibbonFor ──
     Ab leaderboard row me premium_level + premium_expires aata hai (public),
     isliye kisi bhi player ke naam ke aage ribbon lag sakta hai. Expired
     premium par koi ribbon NAHI — jhoota dava nahi. */
  beat('8b/12 premium ribbon (doosre player ka)');
  ok(window.premiumRibbonFor(0, 0, 15) === '', 'level 0 → khaali');
  ok(window.premiumRibbonFor(2, Date.now() + 86400000, 15).indexOf('premium/ribbon.png') !== -1, 'level 2 + valid expiry → ribbon');
  ok(window.premiumRibbonFor(3, Date.now() - 60000, 15) === '', 'expired premium → KOI ribbon nahi (jhoota dava nahi)');
  ok(window.premiumRibbonFor(2, 0, 15).indexOf('height:15px') !== -1, 'size param kaam karta hai (expiry null = lifetime)');
  ok(window.premiumRibbonFor(2, Date.now() + 86400000, 15).indexOf('data-premium-tier="2"') !== -1, 'tier data-attribute');

  beat('8c/12 trial aakhri 12 ghante — countdown banner');
  /* ── 8c. Premium expiry banner (trial ke aakhri 12 ghante) ──
     Sirf 12 ghante ya kam bachein tab dikhta hai; zyada waqt = khaali;
     koi premium nahi = khaali (jhoota countdown kabhi nahi). */
  window.getUserPremiumTier = function () { return 2; };
  window.UD = { premium: { tier: 2, expiresAt: Date.now() + (6 * 3600 * 1000) } };
  var b1 = window.renderPremiumExpiryBanner();
  ok(b1.indexOf('id="premExpiryBanner"') !== -1, '12h ke andar → banner HTML');
  ok(b1.indexOf('premExpiryCount') !== -1 && /\d\d:\d\d:\d\d/.test(b1), 'countdown H:M:S format me');
  ok(b1.indexOf('continue') !== -1, 'banner par CTA button');
  window.UD = { premium: { tier: 2, expiresAt: Date.now() + (20 * 3600 * 1000) } };
  ok(window.renderPremiumExpiryBanner() === '', '20 ghante bache → banner NAHI (window ke bahar)');
  window.UD = { premium: { tier: 2, expiresAt: Date.now() - 60000 } };
  ok(window.renderPremiumExpiryBanner() === '', 'expire ho chuka → banner NAHI');
  window.getUserPremiumTier = function () { return 0; };
  window.UD = { premium: { tier: 0, expiresAt: Date.now() + (3 * 3600 * 1000) } };
  ok(window.renderPremiumExpiryBanner() === '', 'koi premium nahi → banner NAHI (jhoota countdown kabhi nahi)');
  /* asli DOM me lagne + tick hone ka check */
  window.getUserPremiumTier = function () { return 1; };
  window.UD = { premium: { tier: 1, expiresAt: Date.now() + (11 * 3600 * 1000) } };
  var _shown = window.updatePremiumExpiryBanner();
  var _el = document.getElementById('premExpiryBanner');
  ok(_shown === true && !!_el, 'banner DOM me laga');
  var _left1 = _el ? Number(_el.getAttribute('data-ms-left')) : 0;
  ok(_left1 > (10.5 * 3600 * 1000) && _left1 <= (11 * 3600 * 1000), 'data-ms-left ~11 ghante', String(_left1));
  var _cntTxt = (document.getElementById('premExpiryCount') || {}).textContent || '';
  ok(/^\d\d:\d\d:\d\d$/.test(_cntTxt), 'banner par live time chal raha hai (' + _cntTxt + ')');
  ok(_el && _el.style.position === 'fixed' && Number(_el.style.zIndex) >= 9990, 'banner fixed + sabse upar (z-index)');
  /* expiry khatam → banner khud hat jaye (live DOM par) */
  window.UD = { premium: { tier: 1, expiresAt: Date.now() - 1000 } };
  ok(window.updatePremiumExpiryBanner() === false && !document.getElementById('premExpiryBanner'),
     'expiry ke baad banner khud hat gaya (DOM saaf)');
  /* RESULT ko dhakne se bachane ke liye live fixed banner hata diya —
     uski shakal screenshot me VISUAL card ke roop me neeche dikhti hai. */

  beat('9/12 Collection gallery render');
  /* ── 9. ASLI Collection gallery ka render (openModal ko capture karke) ──
     Ye nakli nahi: showAssetGallery() hi chalta hai, bas uska modal
     output pakad lete hain — 60 items + images + UNLOCKED/🔒 dono. */
  var _modal = { title: '', html: '' };
  window.openModal = function (t, h) { _modal.title = t; _modal.html = h || ''; };
  window._assetStatsCached = ST;
  try {
    window.showAssetGallery();
    var imgs = (_modal.html.match(/<img/g) || []).length;
    ok(_modal.title.indexOf('Collection') !== -1, 'Collection modal khula (' + _modal.title + ')');
    ok(imgs >= 55, 'Collection me saare item images render (' + imgs + ' <img>)');
    ok(_modal.html.indexOf('UNLOCKED') !== -1 && (_modal.html.indexOf('🔒') !== -1 || _modal.html.indexOf('LOCKED') !== -1), 'unlocked + locked dono states render');
  } catch (e) { ok(false, 'Collection render crash: ' + e.message); }

  /* ── 8e. SEASON countdown strip (3.8) — asli code, asli numbers ──
     Live app me season abhi INACTIVE hai (admin ki setting) — isliye
     screen par strip nahi aata; yahan dono baatein verify hoti hain:
       (a) active season par strip + #pos + Top-3 near-miss, aur
       (b) live state (inactive) par strip bilkul nahi (jhooti deadline nahi). */
  beat('8e/12 season countdown strip (+ Top-3 near-miss)');
  (function () {
    var _sSeason = window.getCurrentSeason, _sU = window.U, _sRows = window._ssRows, _sLoad = window._ssLoad;
    var _rows = [];
    for (var i = 1; i <= 10; i++) _rows.push({ id: i === 7 ? 'me-uid' : ('u' + i), total_kills: 100 - (i - 1) * 5, total_wins: 5, rank_points: 100 - i });
    window.getCurrentSeason = function () { return { name: 'Season 7', daysLeft: 3, hasEnd: true, active: true, label: '3 din baaki' }; };
    if (window.__SS_SET_ROWS) window.__SS_SET_ROWS(_rows);
    window.U = { uid: 'me-uid' };
    var html = window.renderSeasonCountdownStrip();
    ok(html.indexOf('seasonCountdownStrip') !== -1 && html.indexOf('data-days-left="3"') !== -1, 'active season → strip + countdown (3 din)');
    ok(html.indexOf('Top-3 se') !== -1 && html.indexOf('data-gap="21"') !== -1, 'Top-3 ka near-miss asli number se (21 kills)');
    ok(html.indexOf('#7') !== -1, 'meri position strip me (#7)');
    ok(html.indexOf('renderRank') !== -1, 'strip tap → rank screen');
    /* asli DOM me lagao (jaise home screen karti hai) + medal jaisa render check */
    var _host = document.createElement('div'); _host.id = 'seasonStripHost';
    _host.innerHTML = html; document.body.appendChild(_host);
    var _el = document.getElementById('seasonCountdownStrip');
    ok(!!_el && _el.getAttribute('data-pos') === '7', 'strip DOM me laga (data-pos=7)');
    if (_el) _el.remove();
    _host.remove();
    /* (b) live state: season INACTIVE → strip NAHI (yahi asli app me hota hai) */
    window.getCurrentSeason = function () { return { name: 'Season 1', daysLeft: 6, hasEnd: true, active: false, label: '6 din baaki' }; };
    ok(window.renderSeasonCountdownStrip() === '', 'season inactive (live app ka asli state) → strip nahi');
    window.getCurrentSeason = function () { return { name: 'Season 1', daysLeft: 0, hasEnd: false, active: true }; };
    ok(window.renderSeasonCountdownStrip() === '', 'endDate na ho → koi jhooti deadline nahi');
    window.getCurrentSeason = _sSeason; window.U = _sU; if (window.__SS_SET_ROWS) window.__SS_SET_ROWS(_sRows);
  })();

  /* ── 9c. 9 AVATAR RINGS (master plan 3.5) — rank + premium kala se ──
     Store me 9 naye cosmetics (frame type → equip hote hain), art asli
     files se, price server SSOT se match. Currency sink + dikhawa. */
  beat('9c/12 avatar rings (9 cosmetics)');
  (function () {
    var rings = window.__COS_RINGS || [];
    ok(rings.length === 9, '9 rings catalog me', String(rings.length));
    var cat = window.__COS_CATALOG ? window.__COS_CATALOG() : [];
    var inStore = cat.filter(function (i) { return rings.some(function (r) { return r.id === i.id; }); });
    ok(inStore.length === 9, 'store catalog me 9/9 rings dikhte hain', String(inStore.length) + '/' + cat.length);
    ok(inStore.every(function (i) { return i.type === 'frame' && i.img && i.price > 0; }), 'sab frame type + art + price');
    /* store card asli art render karta hai (img fail ho to emoji — fail-safe) */
    var _card = window.__COSHOP && window.__COSHOP.iconHtml ? window.__COSHOP.iconHtml(inStore[0]) : '';
    ok(_card.indexOf('<img src="' + inStore[0].img) !== -1, 'store card par asli kala (<img>)', inStore[0].id);
    /* equip → avatar medal art + glow colour (asli helper) */
    var _sCos = (window.UD && window.UD.cosmetics) || null;
    window.UD = window.UD || {};
    window.UD.cosmetics = { frame_ring_legend: { is_equipped: true } };
    var fa = window.getEquippedFrameArt ? window.getEquippedFrameArt() : null;
    ok(!!fa && fa.img === 'assets/img/ranks/legend.png' && fa.color === '#ff6b2b', 'equip Legend Ring → medal art + glow', fa ? (fa.img + ' ' + fa.color) : 'null');
    window.UD.cosmetics = _sCos || {};
    ok(window.getEquippedFrameArt() === null, 'kuch equipped nahi → medal nahi (jhoota nahi)');
  })();

  beat('10/12 BP season-title arts (t25/35/40/45/50)');
  /* ── 10. Season Pass ki 5 asli kalaayein (yojna 2.6) — ASLI files se ──
     features/battle-pass.js + features/growth.js upar live load hue hain;
     yahan unke read-only hooks se grid/store ka output check hota hai. */
  var BP_ART = [[25,'veteran'],[35,'champion'],[40,'immortal'],[45,'death-bringer'],[50,'reaper']];
  var BP_KEY = {25:'tag_bp_prem_25',35:'emoji_bp_prem_35',40:'tag_bp_prem_40',45:'tag_bp_free_45',50:'tag_bp_prem_50'};
  ok(!!window.__BP && window.__BP.tiers().length === 50, 'battle-pass TIERS_DATA load — 50 tiers',
     window.__BP ? String(window.__BP.tiers().length) : 'hook nahi mila');
  if (window.__BP) {
    var tdAll = window.__BP.tiers();
    var artOk = BP_ART.every(function (c) {
      var td = tdAll[c[0] - 1];
      var r = (c[0] === 45) ? td.free : td.prem;   /* t45 = FREE track (DB: tag_bp_free_45) */
      return td && td.t === c[0] && r && r.img === 'assets/img/titles/' + c[1] + '.png';
    });
    ok(artOk, 'BP grid — t25/35/40/45/50 par 5/5 asli kala', BP_ART.map(function(c){return 't'+c[0];}).join(','));
    var lblHtml = window.__BP.label(tdAll[24].prem, 17);
    ok(lblHtml.indexOf('<img src="assets/img/titles/veteran.png') !== -1, 'tier label HTML me asli <img> (t25 Veteran)');
    ok(tdAll[24].free.type === 'gd' && tdAll[49].free.type === 'gd', 'GD inaam waisa hi — sirf cosmetic par art laga (koi currency nahi badli)');
  }
  ok(!!window.__COSHOP, 'cosmetics store module load (__COSHOP hook)');
  if (window.__COSHOP) {
    var bpList = window.__COSHOP.bpList();
    var storeOk = BP_ART.every(function (c) {
      var it = bpList.filter(function (x) { return x.id === BP_KEY[c[0]]; })[0];
      return it && it.img === 'assets/img/titles/' + c[1] + '.png';
    });
    ok(storeOk, 'store catalog — 5/5 BP title par asli art', bpList.length + ' items');
    var cardHtml = window.__COSHOP.iconHtml({ icon: '🎖️', img: 'assets/img/titles/veteran.png' });
    ok(cardHtml.indexOf('<img src="assets/img/titles/veteran.png') !== -1, 'store card asli kala render karta hai (emoji nahi)');
    ok(window.__COSHOP.iconHtml({ icon: '🎖️' }) === '🎖️', 'img na ho to purana emoji (fail-safe)');
  }

  /* ── VISUAL proof (2026-10-12b): ye cards ASLI code se bane hain —
     __BP.label (tier grid) aur __COSHOP.iconHtml (store card) — aur page
     par render hote hain, taaki emulator ke screenshot me 5 season-title
     kalaayein AANKHON se dikhein (sirf JSON nahi). */
  try {
    var vis = document.createElement('div');
    vis.id = 'bpArtProof';
    var vh = '<h3 style="color:#ffd700;margin:8px 0 5px">Season Pass — 5 asli kalaayein (asli code se render)</h3><div style="display:flex;flex-wrap:nowrap;gap:6px">';
    if (window.__BP && tdAll.length === 50) {
      BP_ART.forEach(function (c) {
        var td = tdAll[c[0] - 1];
        var r = (c[0] === 45) ? td.free : td.prem;
        vh += '<div class="card" style="min-width:150px;max-width:196px;flex:0 0 auto;text-align:center;padding:8px">' + window.__BP.label(r, 26) +
              '<div style="font-size:10px;color:#888;margin-top:4px">Tier ' + c[0] + (c[0] === 45 ? ' · FREE' : ' · PREMIUM') + '</div></div>';
      });
    }
    /* 2026-10-13: 9 AVATAR RINGS — asli store card HTML (art + naam + price) */
    vh += '</div><h3 style="color:#ffd700;margin:8px 0 5px">9 Avatar Rings — rank + premium kala (asli store card HTML)</h3><div style="display:flex;flex-wrap:wrap;gap:6px">';
    if (window.__COSHOP && window.__COS_RINGS) {
      var _rings9 = window.__COS_RINGS;
      _rings9.forEach(function (r) {
        vh += '<div class="card" style="min-width:104px;max-width:124px;flex:0 0 auto;text-align:center;padding:7px">' +
              window.__COSHOP.iconHtml({ icon: r.icon, img: r.img }) +
              '<div style="font-size:10px;font-weight:800;margin-top:3px">' + r.name + '</div>' +
              '<div style="font-size:9px;color:#00d4ff;margin-top:2px">💎 ' + r.price + '</div></div>';
      });
    }
    vh += '</div><h3 style="color:#ffd700;margin:8px 0 5px">Cosmetics Store — season titles (asli store card HTML)</h3><div style="display:flex;flex-wrap:nowrap;gap:6px">';
    if (window.__COSHOP) {
      var bpVis = window.__COSHOP.bpList();
      BP_ART.forEach(function (c) {

      var el = document.getElementById('loginStreakStrip');
      ok(!!el && el.getAttribute('data-done-today') === '1', 'aaj ki ASLI check-in row → "आज हो गया ✓" (button hat gaya)');
      ok(!!el && !el.querySelector('button'), 'done today par check-in button nahi (dobara claim ka lalach nahi)');
      var lab = document.getElementById('lsToday');
      ok(!!lab && lab.innerHTML.indexOf('🪙10') !== -1, 'strip par aaj ka asli reward dikhta hai (+🪙10)');
      window.U = _sU; window._supa = _sSupa;
      if (_host.parentNode) _host.parentNode.removeChild(_host);
      pending--; if (pending === 0) finish();
    }, 900);
  })();

  function finish(note) {
    if (DONE) return;   /* marker sirf EK baar — watchdog/error race me bhi */
    DONE = true;
    beat('finish');
    var pass = FAIL === 0;
    var line = 'SCREEN-E2E-RESULT: ' + PASS + '/' + (PASS + FAIL) + (pass ? ' OK' : ' FAIL(' + fails.join(' | ') + ')');
    if (note) line += ' [' + note + ']';
    var el = document.getElementById('screenE2EResult');
    el.textContent = line;
    el.className = pass ? 'ok' : 'fail';
    out();
    /* logcat/CI ke liye — asset-e2e.html wala hi pattern */
    try { console.error(line); } catch (e) {}
    try { console.log('[E2E] ' + JSON.stringify(window.__BADGE_ENGINE.selftest())); } catch (e) {}
  }
})();
